<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laporan · PPDK.CH</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="tenang.css">
<link rel="stylesheet" href="awam.css">
<style>
.art{max-width:720px}
.art h1{font:800 clamp(26px,4vw,38px)/1.12 var(--display);letter-spacing:-.02em;margin-top:12px}
.art .meta{margin-top:10px;font-size:14.5px;color:var(--ink-2);display:flex;flex-direction:column;gap:3px}
.art .hero{aspect-ratio:16/9;margin-top:22px}
.art h2{font:600 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:26px 0 8px}
.art p.tx{font-size:16px;line-height:1.65}
.art p.tx i{color:var(--muted)}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gal .ph{aspect-ratio:4/3}
.share{display:flex;gap:10px;align-items:center;margin-top:26px;padding-top:16px;border-top:1px solid var(--rule)}
.hash{font:500 13px/1.6 var(--mono);color:var(--petrol)}
</style>
</head>
<body>
<div id="content" class="pw"><div id="body"></div></div>
<script src="shared.js"></script>
<script src="gerak.js"></script>
<script src="data.js"></script>
<script src="awam.js"></script>
<script>
(function () {
  M.mount({ bare: true, noRole: true });
  AW.header('aktiviti');
  var id = new URLSearchParams(location.search).get('id');
  function render() {
  var r = AW.pub.filter(function (x) { return x.id === id; })[0];
  if(!r){document.title='Laporan tidak ditemui';document.getElementById('body').innerHTML='<div class="ph1"><h1>Laporan tidak ditemui</h1><p>Pautan mungkin tidak sah atau laporan belum diterbitkan.</p><a class="btn btn-ink" href="portal.html">Kembali ke aktiviti</a></div>';Gerak.run(document.getElementById('body'));return;}
  document.title = r.tajuk + ' · PPDK.CH';
  var more = AW.pub.filter(function (x) { return x.sek === r.sek && x.id !== r.id; }).slice(0, 3);
  document.getElementById('body').innerHTML = '<article class="art"><p style="margin-top:18px"><a class="text-btn" href="sektor.html?s=' + encodeURIComponent(r.sek) + '">' + M.sk(r.sek) + ' ' + M.esc(AW.short(r.sek)) + '</a></p>' +
    '<h1>' + M.esc(r.tajuk) + '</h1><div class="meta"><span>' + M.fmtDate(r.tarikh) + '</span><span>' + M.esc(AW.place(r)) + '</span></div>' +
    '<div class="ph hero">Gambar utama</div>' +
    '<h2>Objektif</h2><p class="tx">' + M.esc(r.obj||'Melaksanakan aktiviti mengikut perancangan sektor.') + '</p>' +
    '<h2>Rumusan</h2><p class="tx">' + M.esc(r.rum||'Pelaksanaan aktiviti dibincangkan bersama pihak terlibat untuk rujukan sektor.') + '</p>' +
    (r.imp?'<h2>Impak</h2><p class="tx">'+M.esc(r.imp)+'</p>':'') +
    '<h2>Galeri</h2><div class="gal"><div class="ph">1</div><div class="ph">2</div><div class="ph">3</div></div>' +
    '<p class="hash" style="margin-top:18px">#PPDKuching #' + r.sek + '</p>' +
    '<div class="share"><button class="btn btn-line btn-sm" id="cp">Salin pautan</button><span class="tiny">Hantaran Facebook PPD memaut ke halaman ini.</span></div><div class="field" id="share-fallback" hidden><label class="lbl" for="share-url">Pautan laporan</label><p class="hint" id="share-hint" role="alert">Kongsi dan salin automatik gagal. Pilih pautan ini untuk salin sendiri.</p><input id="share-url" type="text" readonly aria-describedby="share-hint" style="width:100%"></div></article>' +
    (more.length ? '<div class="h2p"><h2>Lagi daripada ' + M.esc(AW.short(r.sek)) + '</h2></div><div class="feed">' + more.map(AW.item).join('') + '</div>' : '');
  Gerak.run(document.getElementById('body'));
  document.getElementById('cp').addEventListener('click', async function () {
    var sim = new URLSearchParams(location.search).get('sim'), u = new URL(location.href); u.searchParams.delete('sim');
    var url = u.href;
    document.getElementById('share-fallback').hidden = true;
    if (navigator.share && sim !== 'kongsi-gagal' && sim !== 'salin') { try { await navigator.share({ title: r.tajuk, url: url }); return; } catch (e) {} }
    try { if (sim === 'kongsi-gagal') throw Error('Demo'); await navigator.clipboard.writeText(url); M.toast('Pautan disalin'); }
    catch (e) { document.getElementById('share-fallback').hidden = false; var input = document.getElementById('share-url'); input.value = url; input.focus(); input.select(); }
  });
  }
  document.addEventListener('datachange', function () {
    AW.pub = D.REKOD.filter(function (r) { return r.tahap === 'umum'; }).sort(function (a, b) { return a.tarikh < b.tarikh ? 1 : -1; });
    render();
  });
  render();
})();
</script>
</body>
</html>
