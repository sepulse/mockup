<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Rekod Aktiviti · Staf</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="tenang.css">
<link rel="stylesheet" href="agenda.css">
<link rel="stylesheet" href="bahasa.css">
<style>
.pcard{border:1px solid var(--rule);background:var(--paper)}
.pcard .ph{aspect-ratio:16/8;border:0;border-bottom:1px solid var(--rule)}
.pcard .b{padding:14px}
.pcard h4{font:700 17px/1.3 var(--display);margin:6px 0 4px}
.pcard p{font-size:13.5px;color:var(--ink-2)}
.chk{display:flex;flex-direction:column;gap:9px;margin-top:8px}
.chk label{display:flex;gap:9px;align-items:flex-start;font-size:14px;cursor:pointer}
.chk input{width:17px;height:17px;accent-color:var(--petrol);margin-top:2px}
.fbcap{white-space:pre-line;font-size:13.5px;line-height:1.55;padding:12px;border:1px solid var(--rule);background:var(--card);margin-top:10px}
.drawer-f #save-error{flex-basis:100%;margin:0}
#content .list .li{box-shadow:inset 3px 0 0 var(--sc,var(--rule));padding-left:14px}
#content .list .li.cx{box-shadow:inset 3px 0 0 var(--rule)}
:root[data-theme="dark"] #content .list .li{box-shadow:inset 3px 0 0 color-mix(in srgb,var(--sc) 65%,#fff)}:root[data-theme="dark"] #content .list .li.cx{box-shadow:inset 3px 0 0 var(--rule)}
@media(max-width:780px){#content .list .li{padding-left:12px}}
/* Senarai–butiran (komputer ≥1100px): senarai kiri, butiran rekod dalam panel kanan. */
.dpane{display:none}
@media(min-width:1100px){
  #content.wrap-n{max-width:1240px}
  .ad{display:grid;grid-template-columns:minmax(0,560px) minmax(0,1fr);column-gap:32px;align-items:start}
  .dpane{display:flex;flex-direction:column;position:sticky;top:20px;height:calc(100vh - 40px);border:1px solid var(--ink);background:var(--card)}
  .dpane > .drawer.in-pane{position:static;width:auto;height:100%;border:0;z-index:auto;animation:gin .25s ease-out}
  .dpane .ph0{margin:auto;padding:24px;text-align:center;color:var(--muted);font-size:15px;max-width:300px}
  .dpane .ph0 svg{width:28px;height:28px;margin-bottom:10px;color:var(--rule-2)}
  #list .li[aria-current="true"],#list .ac:has(.m[aria-current="true"]){background:var(--card);outline:2px solid var(--ink);outline-offset:-2px}
}
@media(min-width:1100px) and (prefers-reduced-motion:reduce){.dpane > .drawer.in-pane{animation:none}}
</style>
</head>
<body>
<div id="content" class="wrap-n">
  <div class="page-h"><div><h1>Rekod Aktiviti</h1><div class="sub" id="ctx"></div></div><a class="btn btn-line" href="lapor.html">Tulis laporan terus</a></div>
  <div class="ad"><div class="lcol">
  <div class="qbar">
    <label class="search"><span class="sr">Cari</span><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="q" type="search" placeholder="Cari tajuk, sekolah, pegawai"></label>
    <button class="btn btn-line" type="button" id="tapis">Tapis</button>
  </div>
  <div class="fchips" id="fchips"></div>
  <div id="list"></div>
  </div>
  <aside class="dpane" id="dpane" aria-label="Butiran rekod"></aside>
  </div>
</div>

<script src="shared.js"></script>
<script src="gerak.js"></script>
<script src="data.js"></script>
<script>
(function () {
  M.mount({ page: 'aktiviti' });
  var $ = function (id) { return document.getElementById(id); };
  var params = new URLSearchParams(location.search);
  var SC = { saya: 'Rekod saya', sektor: 'Sektor saya', semua: 'Semua dibenarkan' };
  var STL = D.ST, AKS = { dalaman: 'Dalaman', umum: 'Umum', sulit: 'Sulit' };
  var st = { scope: null, sek: '', stat: params.get('f') || '', akses: '' };
  function byId(id) { return D.REKOD.filter(function (r) { return r.id === id; })[0]; }
  var key = function (r) { return D.stKey(r); };
  function def() { return M.role() === 'kppd' ? 'semua' : M.role() === 'ketua' ? 'sektor' : 'saya'; }
  /* Rekod yang menunggu tindakan SAYA: laporan milik saya, atau permohonan terbit yang saya boleh semak. */
  function canPub(r) { var m = M.me(); return M.role() === 'kppd' || (M.role() === 'ketua' && r.sek === m.sek); }
  function todo(r) { var k = key(r); return ((k === 'need' || k === 'pulang') && r.owner === M.me().name) || (k === 'mohon' && canPub(r)); }

  /* Satu bahasa status (ISTILAH.md): cip yang sama di semua skrin. */
  function chip(r) { return '<span class="stw">' + D.stChip(r) + '</span>'; }
  function dm(d) { return Number(d.slice(8)) + ' Okt'; }
  /* Tarikh rekod: julat untuk tugas berbilang hari; "Hari 2/3" bila sedang berlangsung. */
  function dr(r) { return r.tamat && r.tamat !== r.tarikh ? Number(r.tarikh.slice(8)) + '–' + dm(r.tamat) : dm(r.tarikh); }
  function ongoing(r) { return r.tamat !== r.tarikh && r.tarikh <= M.TODAY && M.TODAY <= r.tamat && r.status !== 'dibatalkan' ? ' · ' + D.timeLabel(r, M.TODAY) : ''; }
  function sub(r, w) { return M.esc(w.t.replace('Tugas rasmi — ', '')) + (r.owner === M.me().name ? '' : ' · ' + M.esc(r.owner)) + D.ictTag(r) + (key(r) === 'pulang' && !w.hidden ? '<br>Dipulangkan — ' + M.esc(r.pulang.sebab) : ''); }
  function row(r) {
    var w = D.where(r), k = key(r);
    return '<button class="li' + (k === 'cx' ? ' cx' : '') + '" style="--sc:var(--s-' + (r.sek === 'Pengurusan' ? 'PGR' : r.sek) + ')" data-r="' + r.id + '"><span class="t">' + dr(r) + '</span><span><span class="n">' + (w.hidden ? 'Tugas rasmi' : M.esc(r.tajuk)) + '</span><span class="s" style="display:block">' + sub(r, w) + ongoing(r) + '</span></span>' + chip(r) + '</button>';
  }
  function card(r) {
    var w = D.where(r), k = key(r);
    /* Semak laporan = petrol; Terbit kekal tindakan akhir dalam panel semakan. */
    var b = k === 'pulang' ? '<a class="btn btn-ink btn-sm" href="lapor.html?id=' + r.id + '">Ubah &amp; hantar semula</a>' : '<button class="btn btn-ink btn-sm" data-r="' + r.id + '">' + (k === 'need' ? 'Lengkapkan laporan' : 'Semak laporan') + '</button>';
    return '<div class="ac' + (k === 'mohon' ? ' rv' : '') + '"><button class="m" data-o="' + r.id + '"><span class="d">' + (k === 'mohon' ? STL.mohon + ' · ' : '') + M.dayName(r.tarikh) + ', ' + dr(r) + '</span><span class="n">' + (w.hidden ? 'Tugas rasmi' : M.esc(r.tajuk)) + '</span><span class="s">' + sub(r, w) + '</span></button>' + b + '</div>';
  }
  function grp(id, title, rows, body) { return rows.length ? '<section class="grp" aria-labelledby="g-' + id + '"><h2 class="grp-h" id="g-' + id + '">' + title + ' <small>' + rows.length + '</small></h2>' + body + '</section>' : ''; }

  function list() { list0(); mark(); Gerak.run($('content'), { items: '.ac,.grp-h,.calm' }); }
  /* Rekod yang sedang dipapar dalam panel kanan ditanda dalam senarai. */
  var cur = '';
  function mark() { [].forEach.call(document.querySelectorAll('#list .li[data-r], #list [data-o]'), function (el) { var on = !!cur && (el.getAttribute('data-r') || el.getAttribute('data-o')) === cur; if (on) el.setAttribute('aria-current', 'true'); else el.removeAttribute('aria-current'); }); }
  function ph0() { $('dpane').innerHTML = '<div class="ph0">' + M.icon('list') + '<p>Pilih rekod di sebelah kiri untuk melihat butiran.</p></div>'; }
  function list0() {
    var m = M.me(), t = $('q').value.trim().toLowerCase();
    var rows = D.REKOD.filter(function (r) {
      if (st.scope === 'saya' && !D.involves(r, m.name)) return false;
      if (st.scope === 'sektor' && r.sek !== m.sek) return false;
      if (st.sek && r.sek !== st.sek) return false;
      var hid = r.tahap === 'sulit' && !D.canSulit(r);
      if (t && (r.owner + ' ' + (hid ? '' : r.tajuk + ' ' + r.sekolah.join(' ') + ' ' + (r.lokasi || ''))).toLowerCase().indexOf(t) < 0) return false;
      if (st.stat && key(r) !== st.stat) return false;
      if (st.akses && r.tahap !== st.akses) return false;
      return true;
    });
    $('ctx').textContent = SC[st.scope] + ' · Oktober 2026';
    var asc = function (a, b) { return a.tarikh < b.tarikh ? -1 : a.tarikh > b.tarikh ? 1 : a.mula < b.mula ? -1 : 1; };
    var desc = function (a, b) { return asc(b, a); };
    var act = rows.filter(todo).sort(asc);
    var plan = rows.filter(function (r) { return !todo(r) && key(r) === 'plan'; }).sort(asc);
    var past = rows.filter(function (r) { return !todo(r) && key(r) !== 'plan' && key(r) !== 'cx'; }).sort(desc);
    var cx = rows.filter(function (r) { return key(r) === 'cx'; }).sort(desc);
    var h = '<section class="grp" aria-labelledby="g-act"><h2 class="grp-h" id="g-act">Perlu tindakan' + (act.length ? ' <span class="cnt">' + act.length + '</span>' : '') + '</h2>' +
      (act.length ? act.map(card).join('') : '<p class="calm">' + M.icon('check') + 'Semua laporan lengkap</p>') + '</section>' +
      grp('plan', 'Hari ini &amp; akan datang', plan, '<div class="list">' + plan.map(row).join('') + '</div>') +
      grp('past', 'Lepas', past, '<div class="list">' + past.map(row).join('') + '</div>') +
      (cx.length ? '<details class="cx-d"><summary>Dibatalkan (' + cx.length + ')</summary><div class="list">' + cx.map(row).join('') + '</div></details>' : '');
    /* Keadaan kosong: tiada hasil tapisan ≠ belum ada data (ISTILAH.md). */
    if (!rows.length) h = (t || st.sek || st.stat || st.akses || st.scope !== def())
      ? '<div class="empty">Tiada rekod sepadan dengan tapisan ini.<div style="margin-top:12px"><button class="btn btn-line btn-sm" type="button" data-act="reset0">Set semula tapisan</button></div></div>'
      : '<div class="empty">Belum ada rekod untuk Oktober 2026.<div style="margin-top:12px"><a class="btn btn-ink btn-sm" href="rekod.html">' + M.icon('plus') + ' Rekod</a></div></div>';
    $('list').innerHTML = h;
    var ch = []; if (st.sek) ch.push(['sek', st.sek]); if (st.stat) ch.push(['stat', STL[st.stat]]); if (st.akses) ch.push(['akses', AKS[st.akses]]);
    $('fchips').innerHTML = ch.map(function (c) { return '<button class="chip" data-x="' + c[0] + '">' + c[1] + ' <span class="x">✕</span></button>'; }).join('');
  }

  function reset0() { st.scope = def(); st.sek = ''; st.stat = ''; st.akses = ''; $('q').value = ''; list(); }
  function tapis() {
    var d = M.drawer({ title: 'Tapis', body:
      '<div class="field"><span class="lbl">Tunjuk</span><div class="seg" id="tsc" role="group" aria-label="Tunjuk">' + ['saya', 'sektor', 'semua'].map(function (k) { return '<button type="button" data-v="' + k + '" aria-pressed="' + (st.scope === k) + '">' + SC[k] + '</button>'; }).join('') + '</div></div>' +
      '<div class="field"><label class="lbl" for="tsek">Sektor</label><select id="tsek"><option value="">Semua sektor</option>' + M.SEKTOR.map(function (s) { return '<option value="' + s.k + '"' + (s.k === st.sek ? ' selected' : '') + '>' + s.n + '</option>'; }).join('') + '</select></div>' +
      '<div class="field"><label class="lbl" for="tst">Status</label><select id="tst"><option value="">Semua</option>' + ['plan', 'need', 'done', 'pulang', 'mohon', 'pub', 'cx'].map(function (k) { return '<option value="' + k + '"' + (k === st.stat ? ' selected' : '') + '>' + STL[k] + '</option>'; }).join('') + '</select></div>' +
      '<div class="field"><label class="lbl" for="tak">Akses</label><select id="tak"><option value="">Semua</option>' + Object.keys(AKS).map(function (k) { return '<option value="' + k + '"' + (k === st.akses ? ' selected' : '') + '>' + AKS[k] + '</option>'; }).join('') + '</select></div>',
      foot: '<button class="text-btn" data-act="reset">Set semula</button><button class="btn btn-ink" data-act="ok">Tunjuk hasil</button>' });
    var sc = st.scope;
    d.querySelector('#tsc').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; sc = b.getAttribute('data-v'); [].forEach.call(this.children, function (x) { x.setAttribute('aria-pressed', x === b); }); });
    d.querySelector('[data-act="ok"]').addEventListener('click', function () { st.scope = sc; st.sek = d.querySelector('#tsek').value; st.stat = d.querySelector('#tst').value; st.akses = d.querySelector('#tak').value; M.closeDrawer(); list(); });
    d.querySelector('[data-act="reset"]').addEventListener('click', function () { reset0(); M.closeDrawer(); });
  }

  /* Lengkapkan laporan: halaman penuh 3 langkah (lapor.html). */
  function lapor(r) {
    if (r.owner !== M.me().name) { D.openRecord(r); return; }
    location.href = 'lapor.html?id=' + encodeURIComponent(r.id);
  }

  /* Terbit: satu pratonton kad portal; kapsyen FB dilipat; semakan penerbit. */
  function terbit(r) {
    var m = M.me(), isPub = (M.role() === 'ketua' && r.sek === m.sek) || M.role() === 'kppd';
    if (r.tahap === 'sulit') { D.openRecord(r); return; }
    var sens = r.sek === 'SPsK' || r.sek === 'SPP', noPhoto = !((r.photos && r.photos.length) || r.gam);
    var place = D.where(r).t.replace('Tugas rasmi — ', '');
    var body = (sens ? '<p class="flag warn">Sektor ' + r.sek + ': penerbitan awam belum dibuka.</p>' : '') +
      '<div class="pcard">' + (r.photos && r.photos[0] ? '<img src="' + M.esc(r.photos[0].src) + '" alt="Gambar utama" style="display:block;width:100%;aspect-ratio:16/8;object-fit:cover">' : '<div class="ph">Gambar utama</div>') + '<div class="b">' + M.sk(r.sek) + '<h4 role="heading" aria-level="3">' + M.esc(r.tajuk) + '</h4><p>' + M.fmtDate(r.tarikh) + ' · ' + M.esc(place) + '</p><p style="margin-top:8px">' + M.esc(r.rum||'Rumusan belum diisi.') + '</p></div></div>' +
      '<details class="more"><summary>Lihat kapsyen Facebook</summary><div class="fbcap">' + M.esc(D.post(r, 'fb')) + '</div></details>' +
      (isPub ? '<div class="section-t">Semakan sebelum terbit</div><div class="chk"><label><input type="checkbox" class="ck"> Tiada nama murid, data kes atau peperiksaan</label><label><input type="checkbox" class="ck"> Gambar sesuai untuk awam</label><label><input type="checkbox" class="ck"> Fakta dan nama sekolah betul</label></div><div class="field" style="margin-top:18px"><label class="lbl" for="sebab-pulang">Sebab dipulangkan</label><textarea id="sebab-pulang" rows="3" required aria-describedby="pulang-hint"></textarea><p class="hint" id="pulang-hint">Isi sebab sebelum Pulangkan supaya pegawai tahu apa yang perlu dibaiki.</p></div>' : (!r.mohon ? (noPhoto ? '<p class="flag warn" style="margin-top:14px">Tambah sekurang-kurangnya satu gambar sebelum hantar. <a class="text-btn" href="lapor.html?id=' + r.id + '&amp;langkah=gambar">Tambah gambar</a></p>' : '') +
        '<div class="section-t">Sebelum hantar</div><div class="chk"><label><input type="checkbox" class="ck2"> Tiada nama murid, data kes, kesihatan atau peperiksaan</label><label><input type="checkbox" class="ck2"> Gambar sesuai untuk paparan awam</label></div>' : '') +
        '<p class="tiny" style="margin-top:14px">Ketua sektor ' + r.sek + ' akan menyemak sebelum diterbitkan di ppdk.ch dan Facebook.</p>');
    body += '<p class="hint" id="check-hint"' + (!isPub && r.mohon ? ' hidden' : '') + '>Tandakan semua semakan sebelum ' + (isPub ? 'terbit.' : 'hantar.') + '</p>';
    var foot = isPub ? '<button class="text-btn" data-act="back" disabled aria-describedby="pulang-hint">Pulangkan</button><button class="btn btn-ink" data-act="pub" disabled aria-describedby="check-hint">Terbit</button>'
      : r.mohon ? '<button class="btn btn-line" data-close>Tutup</button>' : '<button class="btn btn-ink" data-act="mohon" disabled>Hantar untuk semakan</button>';
    cur = r.id; var d = M.drawer({ pane: true, title: isPub ? 'Semak laporan' : 'Mohon terbit', body: body, foot: '<div id="save-error" hidden></div>' + foot }); mark();
    function persistChange(before, button) {
      if (D.persist()) return true;
      Object.keys(r).forEach(function (k) { delete r[k]; }); Object.assign(r, JSON.parse(before));
      D.saveFailure(d.querySelector('#save-error'), function () { button.click(); }); return false;
    }
    var cks = d.querySelectorAll('.ck'), pb = d.querySelector('[data-act="pub"]');
    [].forEach.call(cks, function (c) { c.addEventListener('change', function () { var unchecked = [].some.call(cks, function (x) { return !x.checked; }); pb.disabled = sens || unchecked; d.querySelector('#check-hint').hidden = !unchecked; }); });
    if (pb) pb.addEventListener('click', function () { var before = JSON.stringify(r); r.tahap = 'umum'; r.mohon = false; if (!persistChange(before, pb)) return; M.closeDrawer(); list(); M.toast('Diterbitkan'); });
    var c2 = d.querySelectorAll('.ck2'), mo = d.querySelector('[data-act="mohon"]');
    [].forEach.call(c2, function (c) { c.addEventListener('change', function () { var unchecked = [].some.call(c2, function (x) { return !x.checked; }); mo.disabled = sens || noPhoto || unchecked; d.querySelector('#check-hint').hidden = !unchecked; }); });
    if (mo) mo.addEventListener('click', function () { var before = JSON.stringify(r); r.mohon = true; delete r.pulang; if (!persistChange(before, mo)) return; M.closeDrawer(); list(); M.toast('Dihantar untuk semakan ketua sektor ' + r.sek); });
    var bk = d.querySelector('[data-act="back"]'), reason = d.querySelector('#sebab-pulang');
    if (bk) {
      reason.addEventListener('input', function () { bk.disabled = !reason.value.trim(); });
      bk.addEventListener('click', function () {
        var sebab = reason.value.trim(); if (!sebab) { reason.focus(); return; }
        var before = JSON.stringify(r);
        r.mohon = false; r.pulang = { sebab: sebab, oleh: m.name, tarikh: M.TODAY };
        if (!persistChange(before, bk)) return;
        M.closeDrawer(); list(); M.toast('Dipulangkan kepada pegawai');
      });
    }
  }

  $('tapis').addEventListener('click', tapis);
  $('q').addEventListener('input', list);
  document.addEventListener('click', function (e) {
    var x = e.target.closest('[data-x]'); if (x) { st[x.getAttribute('data-x')] = ''; list(); return; }
    if (e.target.closest('[data-act="reset0"]')) { reset0(); return; }
    var o = e.target.closest('#list [data-o]'); if (o) { show(byId(o.getAttribute('data-o'))); return; }
    var row = e.target.closest('#list [data-r]'); if (!row) return;
    var r = byId(row.getAttribute('data-r')), k = key(r), m = M.me();
    /* Komputer: ketik baris = butiran dalam panel; butang dalam kad kekal tindakan terus. */
    if (M.paneOn() && row.classList.contains('li') && !(k === 'mohon' && M.role() !== 'staf' && (M.role() === 'kppd' || r.sek === m.sek))) { show(r); return; }
    if (k === 'need' && r.owner === m.name) lapor(r);
    else if (k === 'mohon' && M.role() !== 'staf' && (M.role() === 'kppd' || r.sek === m.sek)) terbit(r);
    else show(r);
  });
  function show(r) { cur = r.id; D.openRecord(r); mark(); }
  M.setPane($('dpane')); ph0();
  $('dpane').addEventListener('paneclose', function () { cur = ''; mark(); ph0(); });
  document.addEventListener('rolechange', function () { st.scope = def(); list(); });
  document.addEventListener('datachange', list);
  st.scope = def(); if (st.stat === 'mohon' && M.role() === 'ketua') st.scope = 'sektor'; list();
  var lp = byId(params.get('lapor') || ''), tb = byId(params.get('terbit') || '');
  if (lp) lapor(lp); else if (tb) terbit(tb);
  else if (M.paneOn()) { var f0 = document.querySelector('#list [data-o], #list .li[data-r]'); if (f0) show(byId(f0.getAttribute('data-o') || f0.getAttribute('data-r'))); }
})();
</script>
</body>
</html>
