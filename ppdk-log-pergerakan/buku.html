<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Buku Pergerakan · Log Pergerakan</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="bahasa.css">
<link rel="stylesheet" href="gerak.css">
</head>
<body>
<div id="content" class="wrap">
  <div class="page-h"><div><h1>Buku Pergerakan</h1><div class="sub" id="sub"></div></div>
    <div class="tags only-lead"><button class="btn btn-line btn-sm" type="button" id="csv"><svg class="i" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M4 20h16"/></svg>Muat turun CSV</button><button class="btn btn-line btn-sm hide-m" type="button" id="cetak"><svg class="i" viewBox="0 0 24 24"><path d="M6 9V3h12v6M6 18H3v-8h18v8h-3"/><rect x="6" y="14" width="12" height="7"/></svg>Cetak</button></div>
  </div>
  <div class="toolbar">
    <div class="dnav"><button class="iconbtn" type="button" id="prev" aria-label="Hari sebelumnya"><svg class="i" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button><b id="dlbl"></b><button class="iconbtn" type="button" id="next" aria-label="Hari berikutnya"><svg class="i" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button><button class="text-btn" type="button" id="tdy">Hari ini</button></div>
    <select id="sek" aria-label="Sektor" class="only-kppd"></select>
  </div>
  <div id="out" style="margin-top:16px"></div>
  <p class="note simpan" id="simpan"></p>
</div>

<script src="app.js"></script>
<script src="gerak.js"></script>
<script>
(function () {
  G.mount({ page: 'buku' });
  var $ = function (id) { return document.getElementById(id); };
  var qs = new URLSearchParams(location.search);
  var st = { d: qs.get('d') || G.TODAY, sek: '' };
  var MIN_D = '2026-10-12';
  $('sek').innerHTML = '<option value="">Semua sektor</option>' + G.SEKTOR.map(function (s) { return '<option value="' + s.k + '">' + G.esc(s.n) + '</option>'; }).join('');
  $('simpan').innerHTML = G.icon('info') + '<span>Rekod disimpan ' + G.SIMPAN_BULAN + ' bulan, kemudian dipadam automatik (cadangan; perlu kelulusan KPPD). Rekod dibatalkan, rekod lewat dan pembetulan kekal dipaparkan untuk jejak audit.</span>';

  /* Skop: staf = rekod sendiri; ketua sektor = sektornya; KPPD = semua (boleh tapis sektor). */
  function inScope(sid) {
    var role = G.role(), m = G.me(), s = G.staf(sid);
    if (role === 'staf') return sid === m.id;
    if (role === 'ketua') return s.sek === m.sek;
    return !st.sek || s.sek === st.sek;
  }
  function scope() {
    return G.LOG.filter(function (r) { return G.covers(r, st.d) && (!r.batal || r.d === st.d) && inScope(r.sid); })
      .sort(function (a, b) { return (a.d < st.d ? -1 : G.toMin(a.keluar)) - (b.d < st.d ? -1 : G.toMin(b.keluar)); });
  }
  function absen() {
    return G.CUTI.filter(function (c) { return c.dari <= st.d && st.d <= c.hingga && inScope(c.sid); })
      .sort(function (a, b) { return G.staf(a.sid).n.localeCompare(G.staf(b.sid).n); });
  }
  function keluarTxt(r) {
    if (r.d !== st.d) return '<small class="muted">sejak</small> ' + G.fmtShort(r.d);
    var lw = G.canSeeFor(r.sid) ? G.lewatRekod(r) : null;
    return r.keluar + (lw ? '<small class="flag">Direkod lewat · ' + lw + '</small>' : '');
  }
  function jangkaTxt(r) { return r.pulang ? (r.hingga ? 'hingga ' + G.fmtShort(r.hingga) : '—') : r.jangka; }
  function masukTxt(r) {
    if (r.batal) return '<span class="flag">Dibatalkan ' + r.batal + '</span>';
    if (r.masuk) return r.masuk + (r.masukD && r.masukD !== r.d ? ' <small class="muted">(' + G.fmtShort(r.masukD) + ')</small>' : '') + (r.betul && G.canSeeFor(r.sid) ? '<small class="flag">Dibetulkan ' + r.betul + '</small>' : '');
    if (r.hingga) return 'Tugas luar';
    if (r.pulang) return r.d === G.TODAY && G.toMin(G.now()) < G.toMin(G.TAMAT_KERJA) ? 'Tidak kembali' : 'Terus pulang';
    if (r.d === G.TODAY) return G.toMin(r.keluar) > G.toMin(G.now()) ? 'Belum keluar' : 'Masih di luar';
    return '<span class="flag">Tiada rekod masuk</span>';
  }
  function statusCsv(r) {
    var a = [];
    if (!G.canSeeFor(r.sid)) return r.batal ? 'Dibatalkan' : '';
    if (r.batal) a.push('Dibatalkan ' + r.batal);
    if (r.d === st.d && G.lewatRekod(r)) a.push('Direkod lewat ' + r.dibuat);
    if (r.betul) a.push('Dibetulkan ' + r.betul);
    if (!r.masuk && !r.batal && !r.pulang && r.d < G.TODAY) a.push('Tiada rekod masuk');
    return a.join('; ');
  }
  function rangeTxt(c) { return c.dari === c.hingga ? G.fmtShort(c.dari) : G.fmtShort(c.dari) + ' – ' + G.fmtShort(c.hingga); }
  function scopeLbl() {
    var role = G.role(), m = G.me();
    if (role === 'staf') return 'Rekod saya sahaja';
    if (role === 'ketua') return G.sekName(m.sek);
    if (!st.sek) return 'Semua sektor · PPD';
    var k = G.ketuaOf(st.sek);
    return G.sekName(st.sek) + (k ? ' · penyemak: ' + k.n : '');
  }

  function render() {
    var rows = scope(), staf = G.role() === 'staf', ab = absen();
    var nBatal = rows.filter(function (r) { return r.batal; }).length, nAb = ab.filter(function (c) { return !c.batal; }).length;
    $('dlbl').textContent = G.fmtDate(st.d, true);
    $('sub').textContent = scopeLbl() + ' · ' + (rows.length - nBatal) + ' rekod keluar' + (nBatal ? ' · ' + nBatal + ' dibatalkan' : '') + (nAb ? ' · ' + nAb + ' tidak hadir' : '');
    $('prev').disabled = st.d <= MIN_D; $('next').disabled = st.d >= G.TODAY; $('tdy').hidden = st.d === G.TODAY;
    var h;
    if (!rows.length) h = '<p class="empty">' + (staf ? 'Anda tiada rekod keluar pada hari ini.' : 'Tiada rekod keluar pada hari ini.') + '</p>';
    else {
      var tbl = '<div class="tbl-wrap"><table class="tbl"><thead><tr>' + (staf ? '' : '<th>Pegawai</th><th>Sektor</th>') + '<th>Keluar</th><th>Destinasi</th><th>Tujuan</th><th>Jangka</th><th>Masuk</th></tr></thead><tbody>' +
        rows.map(function (r) {
          var s = G.staf(r.sid);
          return '<tr' + (r.batal ? ' class="cx"' : '') + '>' + (staf ? '' : '<td><b>' + G.esc(s.n) + '</b></td><td>' + G.sk(s.sek) + '</td>') + '<td class="m">' + keluarTxt(r) + '</td><td>' + G.destOf(r) + (r.nota && G.canSeePrivate(r) ? '<div class="muted" style="font-size:13px">' + G.esc(r.nota) + '</div>' : '') + '</td><td>' + (G.tujOf(r) || '—') + '</td><td class="m">' + jangkaTxt(r) + '</td><td class="m">' + masukTxt(r) + '</td></tr>';
        }).join('') + '</tbody></table></div>';
      var cards = '<div class="cards-m">' + rows.map(function (r) {
        var s = G.staf(r.sid), t = G.tujOf(r);
        return '<div class="ent' + (r.batal ? ' cx' : '') + '"><div class="w">' + (staf ? '' : '<div class="n"><b>' + G.esc(s.n) + '</b>' + G.sk(s.sek) + '</div>') + G.destOf(r) + (t ? '<small>' + t + '</small>' : '') + '</div>' +
          '<div class="t"><b>' + (r.d === st.d ? r.keluar : G.fmtShort(r.d)) + ' → ' + (r.masuk || '…') + '</b><small>' + (r.masuk && !r.batal ? 'jangka ' + jangkaTxt(r) : masukTxt(r)) + '</small>' +
          (r.d === st.d && G.canSeeFor(r.sid) && G.lewatRekod(r) ? '<small class="flag">Direkod lewat · ' + r.dibuat + '</small>' : '') + (r.betul && !r.batal && G.canSeeFor(r.sid) ? '<small class="flag">Dibetulkan ' + r.betul + '</small>' : '') + '</div></div>';
      }).join('') + '</div>';
      h = tbl + cards;
    }
    if (ab.length) {
      h += '<section class="absen"><div class="section-t">Tidak hadir</div><ul>' + ab.map(function (c) {
        var s = G.staf(c.sid);
        return '<li>' + (staf ? '' : '<b>' + G.esc(s.n) + '</b>' + G.sk(s.sek)) + '<span>' + G.jenisCuti(c) + '</span><span class="muted">' + rangeTxt(c) + '</span>' + (c.batal ? '<span class="flag">Dibatalkan ' + c.batal + '</span>' : '') + '</li>';
      }).join('') + '</ul></section>';
    }
    $('out').innerHTML = h;
    if (window.Gerak) Gerak.run($('out'), { items: 'tbody tr,.ent,.absen li' });
  }

  function csv() {
    var rows = scope(), head = ['Tarikh', 'Pegawai', 'Sektor', 'Keluar', 'Destinasi', 'Tujuan', 'Catatan', 'Jangka pulang', 'Masuk', 'Status audit'];
    var q = function (v) { v = String(v == null ? '' : v); if (/^[=+\-@\t\r]/.test(v)) v = "'" + v; return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
    var body = rows.map(function (r) {
      var s = G.staf(r.sid), priv = r.tuj === 'Urusan peribadi' && !G.canSeePrivate(r);
      return [st.d, s.n, s.sek, r.d === st.d ? r.keluar : 'sejak ' + r.d, priv ? 'Urusan peribadi' : r.dest, priv ? '' : r.tuj, priv ? '' : (r.nota || ''),
        r.pulang ? (r.hingga ? 'Tugas luar hingga ' + r.hingga : 'Tidak kembali') : r.jangka,
        r.batal ? '' : r.masuk ? r.masuk + (r.masukD && r.masukD !== r.d ? ' (' + r.masukD + ')' : '') : (r.hingga ? 'Tugas luar' : r.pulang ? 'Terus pulang' : ''), statusCsv(r)].map(q).join(',');
    }).concat(absen().map(function (c) {
      var s = G.staf(c.sid);
      return [st.d, s.n, s.sek, '', '', G.canSeeFor(c.sid) ? c.jenis : 'Tidak hadir', c.dari + ' hingga ' + c.hingga, '', '', c.batal ? 'Dibatalkan ' + c.batal : ''].map(q).join(',');
    }));
    var blob = new Blob(['﻿' + [head.join(',')].concat(body).join('\r\n')], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'buku-pergerakan-' + st.d + '.csv'; document.body.appendChild(a); a.click(); a.remove();
    G.toast('CSV dimuat turun · <b>' + body.length + '</b> baris');
  }

  $('prev').addEventListener('click', function () { st.d = G.addDays(st.d, -1); render(); });
  $('next').addEventListener('click', function () { st.d = G.addDays(st.d, 1); render(); });
  $('tdy').addEventListener('click', function () { st.d = G.TODAY; render(); });
  $('sek').addEventListener('change', function () { st.sek = this.value; render(); });
  $('csv').addEventListener('click', csv);
  $('cetak').addEventListener('click', function () { window.print(); });
  document.addEventListener('rolechange', render);
  document.addEventListener('jamchange', render);
  render();
})();
</script>
</body>
</html>
