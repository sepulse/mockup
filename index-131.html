<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>SSeMS Wi-Fi Mockup Preview</title>
<style>
  :root{
    --bg:#eef2f7;
    --panel:#ffffff;
    --ink:#0f172a;
    --muted:#64748b;
    --line:#dbe3ec;
    --accent:#ea580c;
    --accent-soft:#fff7ed;
    --shadow:0 18px 50px rgba(15,23,42,.10);
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}
  button,a{font:inherit}
  body{min-height:100dvh}

  .app{
    min-height:100dvh;
    display:grid;
    grid-template-rows:auto 1fr;
  }

  .topbar{
    position:sticky;
    top:0;
    z-index:20;
    min-height:72px;
    padding:12px 18px;
    border-bottom:1px solid rgba(219,227,236,.95);
    background:rgba(255,255,255,.92);
    backdrop-filter:blur(14px);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
  }

  .brand{min-width:0}
  .eyebrow{
    margin:0 0 3px;
    color:var(--accent);
    font-size:11px;
    font-weight:900;
    letter-spacing:.16em;
    text-transform:uppercase;
  }
  .brand h1{
    margin:0;
    font-size:18px;
    line-height:1.2;
    letter-spacing:-.02em;
  }
  .brand p{
    margin:4px 0 0;
    color:var(--muted);
    font-size:12px;
  }

  .top-actions{
    display:flex;
    align-items:center;
    gap:8px;
    flex:0 0 auto;
  }

  .btn{
    appearance:none;
    border:1px solid var(--line);
    border-radius:10px;
    background:#fff;
    color:var(--ink);
    min-height:40px;
    padding:0 13px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    text-decoration:none;
    font-size:12px;
    font-weight:800;
    cursor:pointer;
    transition:.18s ease;
  }
  .btn:hover{border-color:#b7c4d3;transform:translateY(-1px)}
  .btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
  .btn:focus-visible{outline:3px solid rgba(234,88,12,.22);outline-offset:2px}

  .layout{
    min-height:0;
    display:grid;
    grid-template-columns:260px 1fr;
  }

  .sidebar{
    border-right:1px solid var(--line);
    background:#f8fafc;
    padding:18px 14px;
    overflow:auto;
  }

  .sidebar-label{
    margin:0 8px 10px;
    color:#94a3b8;
    font-size:10px;
    font-weight:900;
    letter-spacing:.14em;
    text-transform:uppercase;
  }

  .variant-list{
    display:grid;
    gap:8px;
  }

  .variant{
    appearance:none;
    width:100%;
    border:1px solid transparent;
    border-radius:12px;
    background:transparent;
    padding:12px;
    text-align:left;
    cursor:pointer;
    transition:.18s ease;
    display:grid;
    grid-template-columns:38px 1fr;
    gap:10px;
    align-items:center;
  }
  .variant:hover{background:#fff;border-color:var(--line)}
  .variant.active{
    background:#fff;
    border-color:#fdba74;
    box-shadow:0 8px 20px rgba(15,23,42,.06);
  }

  .num{
    width:38px;height:38px;
    border-radius:10px;
    display:grid;
    place-items:center;
    background:#e2e8f0;
    color:#475569;
    font-size:11px;
    font-weight:900;
  }
  .variant.active .num{background:var(--accent-soft);color:var(--accent)}
  .variant strong{display:block;font-size:12px;line-height:1.2}
  .variant small{display:block;margin-top:4px;color:var(--muted);font-size:10.5px;line-height:1.3}

  .sidebar-note{
    margin-top:18px;
    padding:12px;
    border:1px dashed #cbd5e1;
    border-radius:12px;
    color:var(--muted);
    font-size:10.5px;
    line-height:1.55;
    background:rgba(255,255,255,.55);
  }

  .main{
    min-width:0;
    min-height:0;
    padding:18px;
    display:grid;
    grid-template-rows:auto 1fr;
    gap:12px;
  }

  .viewer-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }

  .current{
    min-width:0;
  }
  .current-title{
    margin:0;
    font-size:13px;
    font-weight:900;
  }
  .current-path{
    margin:3px 0 0;
    color:var(--muted);
    font:11px/1.35 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .nav-actions{
    display:flex;
    gap:7px;
    flex:0 0 auto;
  }

  .icon-btn{
    appearance:none;
    width:40px;height:40px;
    border:1px solid var(--line);
    border-radius:10px;
    background:#fff;
    color:var(--ink);
    cursor:pointer;
    font-size:17px;
    font-weight:800;
  }
  .icon-btn:hover{border-color:#b7c4d3;background:#f8fafc}
  .icon-btn:focus-visible{outline:3px solid rgba(234,88,12,.22);outline-offset:2px}

  .viewer{
    min-height:0;
    position:relative;
    overflow:hidden;
    border:1px solid var(--line);
    border-radius:16px;
    background:#dfe5ec;
    box-shadow:var(--shadow);
  }

  iframe{
    width:100%;
    height:100%;
    min-height:calc(100dvh - 142px);
    border:0;
    display:block;
    background:#fff;
  }

  .loading{
    position:absolute;
    inset:0;
    z-index:2;
    display:grid;
    place-items:center;
    background:rgba(238,242,247,.88);
    backdrop-filter:blur(5px);
    opacity:0;
    pointer-events:none;
    transition:.18s ease;
  }
  .loading.show{opacity:1}
  .spinner{
    width:30px;height:30px;
    border:3px solid #cbd5e1;
    border-top-color:var(--accent);
    border-radius:50%;
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  .mobile-switcher{display:none}

  @media (max-width:840px){
    .topbar{padding:10px 12px;min-height:66px}
    .brand p{display:none}
    .top-actions .copy-text{display:none}
    .layout{grid-template-columns:1fr}
    .sidebar{display:none}
    .main{padding:10px;gap:10px}
    .mobile-switcher{
      display:flex;
      gap:7px;
      overflow:auto;
      padding:0 0 2px;
      scrollbar-width:none;
    }
    .mobile-switcher::-webkit-scrollbar{display:none}
    .mobile-pill{
      appearance:none;
      flex:0 0 auto;
      min-height:36px;
      border:1px solid var(--line);
      border-radius:999px;
      background:#fff;
      padding:0 12px;
      font-size:11px;
      font-weight:800;
      color:#475569;
      cursor:pointer;
    }
    .mobile-pill.active{
      border-color:#fdba74;
      background:var(--accent-soft);
      color:var(--accent);
    }
    .viewer-head{align-items:flex-end}
    .current-path{max-width:58vw}
    iframe{min-height:calc(100dvh - 170px)}
  }

  @media (max-width:520px){
    .brand h1{font-size:15px}
    .eyebrow{font-size:9px}
    .btn{min-height:38px;padding:0 10px}
    .top-actions{gap:6px}
    .viewer{border-radius:12px}
    .current-title{font-size:12px}
    .current-path{font-size:9.5px}
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <p class="eyebrow">SSeMS · Client Preview</p>
      <h1>Wi-Fi Portal Mockup Index</h1>
      <p>Switch antara setiap variasi tanpa keluar dari halaman ini.</p>
    </div>

    <div class="top-actions">
      <button class="btn" id="copyBtn" type="button" title="Salin link variasi semasa">
        <span>⧉</span><span class="copy-text">Salin Link</span>
      </button>
      <a class="btn primary" id="openBtn" href="#" target="_blank" rel="noopener">
        Buka Penuh ↗
      </a>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <p class="sidebar-label">Variasi</p>
      <div class="variant-list" id="variantList"></div>

      <div class="sidebar-note">
        Semua fail HTML perlu berada dalam folder/root yang sama dengan <strong>index.html</strong> ini di GitHub Pages.
      </div>
    </aside>

    <main class="main">
      <div class="mobile-switcher" id="mobileSwitcher"></div>

      <div class="viewer-head">
        <div class="current">
          <p class="current-title" id="currentTitle">—</p>
          <p class="current-path" id="currentPath">—</p>
        </div>
        <div class="nav-actions">
          <button class="icon-btn" id="prevBtn" type="button" title="Sebelumnya">←</button>
          <button class="icon-btn" id="nextBtn" type="button" title="Seterusnya">→</button>
        </div>
      </div>

      <section class="viewer">
        <div class="loading" id="loading"><div class="spinner" aria-label="Loading"></div></div>
        <iframe id="previewFrame" title="SSeMS Wi-Fi mockup preview"></iframe>
      </section>
    </main>
  </div>
</div>

<script>
const variants = [
  {
    id: "student-v1",
    label: "Student V1",
    desc: "Versi pelajar · Soft",
    file: "ssems-student-wifi-interactive-soft.html"
  },
  {
    id: "student-v2",
    label: "Student V2",
    desc: "Versi pelajar · Soft V2",
    file: "ssems-student-wifi-interactive-soft-v2.html"
  },
  {
    id: "student-v3",
    label: "Student V3",
    desc: "Versi pelajar · Soft V3",
    file: "ssems-student-wifi-interactive-soft-v3.html"
  },
  {
    id: "guest",
    label: "Guest",
    desc: "Versi tetamu · Soft",
    file: "ssems-guest-wifi-interactive-soft.html"
  }
];

const frame = document.getElementById("previewFrame");
const currentTitle = document.getElementById("currentTitle");
const currentPath = document.getElementById("currentPath");
const openBtn = document.getElementById("openBtn");
const copyBtn = document.getElementById("copyBtn");
const loading = document.getElementById("loading");
const variantList = document.getElementById("variantList");
const mobileSwitcher = document.getElementById("mobileSwitcher");

let currentIndex = 0;

function makeDesktopButtons(){
  variants.forEach((item,index)=>{
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "variant";
    btn.dataset.index = index;
    btn.innerHTML = `
      <span class="num">${String(index+1).padStart(2,"0")}</span>
      <span>
        <strong>${item.label}</strong>
        <small>${item.desc}</small>
      </span>
    `;
    btn.addEventListener("click",()=>selectVariant(index,true));
    variantList.appendChild(btn);
  });
}

function makeMobileButtons(){
  variants.forEach((item,index)=>{
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "mobile-pill";
    btn.dataset.index = index;
    btn.textContent = item.label;
    btn.addEventListener("click",()=>selectVariant(index,true));
    mobileSwitcher.appendChild(btn);
  });
}

function setActiveButtons(){
  document.querySelectorAll(".variant").forEach((el,i)=>{
    el.classList.toggle("active",i===currentIndex);
  });
  document.querySelectorAll(".mobile-pill").forEach((el,i)=>{
    el.classList.toggle("active",i===currentIndex);
    if(i===currentIndex){
      el.scrollIntoView({behavior:"smooth",block:"nearest",inline:"center"});
    }
  });
}

function selectVariant(index,updateHash=false){
  currentIndex = (index + variants.length) % variants.length;
  const item = variants[currentIndex];

  setActiveButtons();
  currentTitle.textContent = item.label + " · " + item.desc;
  currentPath.textContent = item.file;
  openBtn.href = item.file;

  loading.classList.add("show");
  frame.src = item.file;

  if(updateHash){
    history.replaceState(null,"","#"+item.id);
  }
}

function startFromHash(){
  const id = location.hash.replace("#","");
  const found = variants.findIndex(v=>v.id===id);
  selectVariant(found >= 0 ? found : 0,false);
}

frame.addEventListener("load",()=>{
  loading.classList.remove("show");
});

document.getElementById("prevBtn").addEventListener("click",()=>{
  selectVariant(currentIndex-1,true);
});

document.getElementById("nextBtn").addEventListener("click",()=>{
  selectVariant(currentIndex+1,true);
});

copyBtn.addEventListener("click",async()=>{
  const item = variants[currentIndex];
  const directUrl = new URL(item.file,location.href).href;
  try{
    await navigator.clipboard.writeText(directUrl);
    const old = copyBtn.innerHTML;
    copyBtn.innerHTML = "<span>✓</span><span class='copy-text'>Disalin</span>";
    setTimeout(()=>copyBtn.innerHTML=old,1200);
  }catch{
    window.prompt("Salin link ini:",directUrl);
  }
});

window.addEventListener("keydown",(e)=>{
  if(e.key==="ArrowLeft") selectVariant(currentIndex-1,true);
  if(e.key==="ArrowRight") selectVariant(currentIndex+1,true);
});

window.addEventListener("hashchange",startFromHash);

makeDesktopButtons();
makeMobileButtons();
startFromHash();
</script>
</body>
</html>
