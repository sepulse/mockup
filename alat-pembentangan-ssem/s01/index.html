<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S01 VLAN Asas</title>
<link rel="stylesheet" href="css/s01.css">
<style>
  .kawasan-lukis > canvas { cursor: grab; }
  .kawasan-lukis > canvas:active { cursor: grabbing; }
  .label-c { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .papan-c {
    position: absolute; left: 0; top: 0; margin: -38px 0 0 -6px; white-space: nowrap;
    font: 700 21px/1 "Segoe UI", sans-serif; color: #FFFBF3; background: #2E2B28;
    border-radius: 7px; padding: 8px 12px 8px 12px; border-left: 0 solid var(--z, #2E2B28);
  }
  .papan-c small { display: block; font-size: 17px; font-weight: 600; margin-top: 5px; opacity: .88; }
  .papan-c:has(small) { margin-top: -60px; }
  .papan-c.berwarna { border-left-width: 7px; }
  .papan-c-switch { color: #2E2B28; background: #FFFBF3; border: 2.5px solid #2E2B28; margin: -20px 0 0 18px; }
  .papan-c-trunk { background: #C8643B; }
  .papan-c-trunk, .papan-c-trunk:has(small) { margin: 8px 0 0 0; }
  .papan-c-pos { margin: -18px 0 0 0; }
  .papan-c-router { margin: 8px 0 0 -60px; }
  .papan-c-net, .papan-c-net:has(small) { margin: 8px 0 0 0; }
  .papan-c-ltb, .papan-c-net { color: #2E2B28; background: #FFFBF3; border: 2.5px solid #2E2B28; }
  .papan-c-gw { font-size: 18px; padding: 6px 10px; margin: -16px 0 0 0; }
  .label-c[data-adegan="rangkaian"] .papan-c-zon { font-size: 17px; padding: 6px 9px; margin-top: -32px; }
  .label-c[data-adegan="rangkaian"] .papan-c-zon small { font-size: 15px; }
  .label-c[data-adegan="rangkaian"] .papan-c-zon:has(small) { margin-top: -50px; }
  .papan-c-nombor { font-size: 18px; padding: 5px 8px; margin: -30px 0 0 -12px; color: #2E2B28; background: #FFFBF3; border: 2px solid #2E2B28; }
  .papan-c-port { margin: -64px 0 0 0; }
  .tajuk-c { position: absolute; right: 32px; top: 24px; font: 700 30px/1.1 "Segoe UI", sans-serif; color: #2E2B28; }
  .hint-c { position: absolute; left: 32px; top: 30px; font: 600 17px/1 "Segoe UI", sans-serif; color: #7C766D; }

  /* Label sementara yang mengikut objek: tag VLAN, tanda ✓/✕, kad DHCP. */
  .lencana-c, .tanda-c, .kad-dhcp-c { position: absolute; transform: translate(-50%, -100%); white-space: nowrap; font-family: "Segoe UI", sans-serif; }
  .lencana-c {
    font-weight: 800; font-size: 20px; line-height: 1; color: #fff; background: var(--z, #2E2B28);
    border: 2.5px solid #2E2B28; border-radius: 6px; padding: 5px 8px;
  }
  .lencana-c.lebar { font-size: 19px; padding: 6px 10px; }
  .lencana-c.kanan { transform: translate(6px, -50%); font-size: 16px; padding: 4px 8px; }
  .lencana-c.putih { color: #2E2B28; background: #FFFBF3; }
  .tanda-c {
    min-width: 46px; height: 46px; border-radius: 23px; display: grid; place-items: center; padding: 0 10px;
    font-size: 30px; font-weight: 800; color: #fff; border: 3px solid #FFFBF3; box-shadow: 0 3px 0 rgba(46, 43, 40, .35);
  }
  .tanda-c small { font-size: 16px; font-weight: 700; margin-left: 6px; }
  .tanda-c:has(small) { display: flex; align-items: center; }
  .tanda-c.ok { background: #15803D; }
  .tanda-c.tolak { background: #A9362C; }
  .tanda-c.tanya { background: #2E2B28; }
  .kad-dhcp-c {
    left: 32px; bottom: 28px; transform: none; background: #FFFBF3; color: #2E2B28; border: 2.5px solid #2E2B28;
    border-left: 8px solid var(--z, #2E2B28); border-radius: 10px; padding: 10px 14px; font-size: 18px; line-height: 1.35;
    box-shadow: 0 6px 0 #EAE0CE;
  }
  .kad-dhcp-c b { display: block; font-size: 20px; margin-bottom: 2px; }
  .kad-dhcp-c span { display: block; }

  /* B5 DHCP: kad pool di kaunter dan jalur empat langkah DORA. */
  .pool-c {
    /* Di bawah lantai simpang, hujung kanan pada penjuru gerbang: tidak menutup laluan atau label lain. */
    position: absolute; transform: translate(-100%, 8px); white-space: nowrap; font: 600 16px/1.3 "Segoe UI", sans-serif;
    color: #2E2B28; background: #FFFBF3; border: 2.5px solid #2E2B28; border-left: 7px solid var(--z, #2E2B28); border-radius: 8px; padding: 5px 10px;
  }
  .pool-c b { display: block; font-size: 17px; }
  .pool-c span { display: block; }
  .dora-c { position: absolute; left: 32px; top: 58px; display: flex; gap: 8px; font: 700 18px/1.15 "Segoe UI", sans-serif; }
  .dora-c span { background: #FFFBF3; color: #7C766D; border: 2.5px solid #D6CDBE; border-radius: 8px; padding: 6px 10px; }
  .dora-c span b { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 11px; background: #D6CDBE; color: #fff; font-size: 14px; margin-right: 4px; }
  .dora-c span small { display: block; font-size: 14px; font-weight: 600; margin-top: 2px; }
  .dora-c span.kini { color: #2E2B28; border-color: var(--z, #2E2B28); box-shadow: 0 0 0 2px var(--z, #2E2B28); }
  .dora-c span.kini b { background: var(--z, #2E2B28); }
  .dora-c span.siap { color: #2E2B28; border-color: #15803D; }
  .dora-c span.siap b { background: #15803D; }

  /* B5 tempoh lease: jam dipercepat dan bar baki lease (paksi 24 jam). */
  .masa-c {
    position: absolute; left: 32px; bottom: 28px; width: 620px; background: #FFFBF3; border: 3px solid #2E2B28; border-radius: 12px;
    padding: 10px 16px 8px; font: 600 17px/1.2 "Segoe UI", sans-serif; color: #2E2B28; box-shadow: 0 6px 0 #EAE0CE;
  }
  .masa-jam { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 6px; }
  .masa-jam small { font-size: 15px; color: #7C766D; }
  .masa-jam b { font: 800 34px/1 "Segoe UI", sans-serif; font-variant-numeric: tabular-nums; }
  .masa-baris { display: grid; grid-template-columns: 170px 1fr 120px; align-items: center; gap: 10px; margin: 6px 0; }
  .masa-baris .trek { position: relative; height: 22px; background: #EFE8DA; border: 2px solid #D6CDBE; border-radius: 6px; overflow: hidden; }
  /* s = tempoh lease penuh (bayang), i = baki lease. */
  .masa-baris s { position: absolute; left: 0; top: 0; bottom: 0; background: var(--z, #2E2B28); opacity: .22; }
  .masa-baris i { position: relative; display: block; height: 100%; background: var(--z, #2E2B28); }
  .masa-baris .baki { text-align: right; font-variant-numeric: tabular-nums; }
  .masa-baris.tamat .nama, .masa-baris.tamat .baki { color: #A9362C; }
  .masa-paksi { display: flex; justify-content: space-between; margin: 0 130px 0 180px; font-size: 13px; color: #7C766D; }

  /* Papan rule firewall (B6). */
  .papan-rule {
    position: absolute; right: 20px; top: 56px; width: max-content; background: #FFFBF3; border: 3px solid #2E2B28;
    border-radius: 12px; padding: 10px 12px 8px; font: 600 16px/1.25 "Segoe UI", sans-serif; color: #2E2B28;
    box-shadow: 0 8px 0 #EAE0CE;
  }
  .papan-rule > b { font-size: 18px; }
  .papan-rule ol { margin: 6px 0 4px; padding-left: 26px; }
  .papan-rule li { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 2px 6px; border-radius: 6px; border: 2.5px solid transparent; margin: 1px 0; }
  .papan-rule li::marker { font-weight: 700; }
  .papan-rule code { font: 600 15px/1.25 Consolas, "Cascadia Mono", monospace; white-space: nowrap; }
  .papan-rule .tindakan { font-size: 13px; font-weight: 800; border-radius: 5px; padding: 2px 6px; color: #fff; flex: none; }
  .papan-rule .tindakan.ok { background: #15803D; }
  .papan-rule .tindakan.tolak { background: #A9362C; }
  .papan-rule li.semak { border-color: #F59E0B; background: #FDF1D8; }
  .papan-rule li.padan-ok { border-color: #15803D; background: #E3F2E7; }
  .papan-rule li.padan-tolak { border-color: #A9362C; background: #F6E1DD; }
  .papan-rule li.dibuang { opacity: .4; text-decoration: line-through; }
  .papan-rule p { margin: 0; font-size: 13px; color: #5A554F; }

  /* Jalur frame (B3, "Tunjuk frame"). */
  .bingkai-c { position: absolute; left: 32px; bottom: 28px; display: flex; font: 700 20px/1 "Segoe UI", sans-serif; border: 3px solid #2E2B28; border-radius: 10px; overflow: hidden; background: #FFFBF3; }
  .bingkai-c span { padding: 12px 16px; border-left: 2px solid #2E2B28; color: #2E2B28; }
  .bingkai-c span:first-child { border-left: 0; }
  .bingkai-c .tag { background: #16A34A; color: #fff; }
  .bingkai-c .tiada { background: #F6E1DD; color: #A9362C; font-style: italic; }

  /* Fallback tanpa WebGL. */
  .tiada-gl { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 12px; padding: 24px 40px; }
  .tiada-gl p { margin: 0; font-size: 24px; color: #A9362C; font-weight: 600; }
  .tiada-gl-lakaran { flex: 1; min-height: 0; display: grid; place-items: center; }
  .tiada-gl-lakaran svg { width: 100%; height: 100%; }
</style>
</head>

<script src="js/lakaran.js"></script>

<script src="js/langkah-b3b7.js"></script>

<script src="js/shell.js"></script>

  S01Shell.mount({ renderer: S01RenderC, langkah: S01_LANGKAH, slaid: S01_SLAID });
</script>
</body>
</html>
