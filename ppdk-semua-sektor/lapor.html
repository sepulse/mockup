<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Laporan · Staf</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="base.css?v=9eee8c54">
<link rel="stylesheet" href="gaya.css?v=cc708408">
<style>
.back{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--ink-2);min-height:44px}
.back svg{width:16px;height:16px}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:6px 0 22px}
.steps button{display:flex;flex-direction:column;align-items:flex-start;gap:5px;padding:10px 10px 9px;border:1px solid var(--rule);border-top:3px solid var(--rule);background:var(--paper);text-align:left;min-height:44px}
.steps b{font:600 10.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.steps span{font-size:13.5px;font-weight:600;color:var(--ink-2);line-height:1.25}
.steps button[aria-current="step"]{border-top-color:var(--sc);background:var(--card)}
.steps button[aria-current="step"] span{color:var(--ink)}
.steps button.ok b{color:var(--petrol)}
.pane[hidden]{display:none}
.auto{border:1px solid var(--rule);border-left:3px solid var(--sc);background:var(--card);padding:14px 16px}
.auto .dl{font-size:14px}
.auto .tiny{margin-top:10px}
.team{display:flex;flex-wrap:wrap;gap:6px}
.team span{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border:1px solid var(--rule);font-size:13px;background:var(--paper)}
.team button{border:1px dashed var(--rule-2);padding:6px 9px;font-size:13px;color:var(--ink-2);min-height:32px}
.aibox{border:1px solid var(--rule);background:var(--paper-2);padding:14px 16px;margin-top:6px}
.aibox .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.aitag{display:inline-flex;align-items:center;gap:6px;font:600 10.5px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--warn);background:var(--warn-bg);padding:5px 7px}
.lblrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.gal4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.gal4 button{aspect-ratio:4/3;border:1px dashed var(--rule-2);font-size:20px;color:var(--muted);background:var(--paper)}
.gal4 button.on{border:1px solid var(--rule);background:repeating-linear-gradient(135deg,var(--paper-2) 0 8px,var(--card) 8px 16px);font:500 11px/1 var(--mono);color:var(--muted)}
.num3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
/* Pratonton format rasmi */
.doc{border:1px solid var(--rule);background:#fff;color:#111;padding:28px 30px;font-size:13.5px;line-height:1.55}
.doc .hd{display:flex;justify-content:space-between;gap:12px;border-bottom:2px solid #111;padding-bottom:10px;margin-bottom:14px}
.doc .hd b{font:800 15px/1.2 var(--display)}
.doc .hd span{font:500 11px/1.4 var(--mono);color:#555;text-align:right}
.doc h3{font:800 17px/1.25 var(--display);margin:0 0 10px;text-transform:uppercase}
.doc table{width:100%;border-collapse:collapse;margin-bottom:12px}
.doc td{border:1px solid #ccc;padding:5px 8px;vertical-align:top}
.doc td:first-child{width:30%;color:#555;font-size:12.5px}
.doc h4{font:700 12px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;margin:14px 0 6px;color:#333}
.doc p,.doc li{white-space:pre-line}
.doc .imgs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.doc .imgs i{aspect-ratio:4/3;background:repeating-linear-gradient(135deg,#eee 0 8px,#f7f7f7 8px 16px);border:1px solid #ddd}
.doc .ft{margin-top:18px;border-top:1px solid #ccc;padding-top:8px;font:500 10.5px/1.4 var(--mono);color:#666}
.share{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chk{display:flex;flex-direction:column;gap:9px;margin-top:8px}
.chk label{display:flex;gap:9px;align-items:flex-start;font-size:14px;cursor:pointer}
.chk input{width:17px;height:17px;accent-color:var(--petrol);margin-top:2px}
.lfoot .text-btn{white-space:nowrap}.lfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:26px 0 30px;padding-top:16px;border-top:1px solid var(--rule)}
.lfoot .r{display:flex;gap:8px;align-items:center}
.donebox{border:1px solid var(--rule);border-left:3px solid var(--petrol);background:var(--card);padding:18px}
.donebox h2{font:700 18px/1.3 var(--display)}
.donebox p{color:var(--ink-2);font-size:14px;margin-top:6px}
.donebox .share{margin-top:14px}
@media(max-width:780px){.steps{gap:4px}.steps button{padding:8px 7px}.steps span{font-size:12.5px}.doc{padding:18px 16px}.gal4{grid-template-columns:repeat(2,1fr)}.doc .imgs{grid-template-columns:repeat(2,1fr)}}
@media print{
  body *{visibility:hidden}
  #doc,#doc *{visibility:visible}
  #doc{position:absolute;left:0;top:0;width:100%;border:0;padding:0}
}
</style>
</head>
<body>
<div id="content" class="wrap-n">
  <a class="back" href="aktiviti.html"><svg class="i" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>Rekod Aktiviti</a>
  <div class="page-h" style="padding-top:4px"><div><h1>Laporan</h1><div class="sub" id="ctx"></div></div></div>
  <div id="main"></div>
</div>

<script src="shared.js?v=8a697040"></script>
<script src="data.js?v=e7619fca"></script>
<script>
(function () {
  M.mount({ page: 'aktiviti' });
  var $ = function (id) { return document.getElementById(id); };
  var id = new URLSearchParams(location.search).get('id');
  var r = D.REKOD.filter(function (x) { return x.id === id; })[0], me = M.me();
  var STEPS = ['Maklumat', 'Kandungan', 'Semak & simpan'], step = 0;

  if (!r || r.owner !== me.name) {
    $('ctx').textContent = '';
    $('main').innerHTML = '<div class="empty" style="border-top:1px solid var(--ink)">' + (r ? 'Hanya pemilik rekod boleh menulis laporan ini.' : 'Rekod tidak ditemui.') + '</div>';
    return;
  }
  document.documentElement.style.setProperty('--sc', 'var(--s-' + (r.sek === 'Pengurusan' ? 'PGR' : r.sek) + ')');
  var w = D.where(r), place = w.t.replace('Tugas rasmi — ', '');
  r.peserta = r.peserta || [];
  $('ctx').innerHTML = M.esc(r.tajuk) + ' ' + M.sk(r.sek);

  function team() { return [r.owner].concat(r.peserta); }
  function lines(t) { return (t || '').split(/\n+/).map(function (x) { return x.replace(/^\s*(\d+[.)]|[-•*])\s*/, '').trim(); }).filter(Boolean); }
  function numbered(t) { return lines(t).map(function (x, i) { return (i + 1) + '. ' + x.charAt(0).toUpperCase() + x.slice(1); }).join('\n'); }
  function dateTxt() { return M.fmtDate(r.tarikh) + (r.tamat && r.tamat !== r.tarikh ? ' – ' + M.fmtDate(r.tamat) : ''); }

  /* ---------- Langkah 1: Maklumat (daripada rekod) ---------- */
  function p1() {
    return '<div class="auto"><dl class="dl">' +
      '<dt>Tarikh</dt><dd>' + dateTxt() + '</dd>' +
      '<dt>Masa</dt><dd>' + r.mula + '–' + r.akhir + '</dd>' +
      '<dt>Tempat</dt><dd>' + M.esc(place) + '</dd>' +
      '<dt>Jenis aktiviti</dt><dd>' + M.esc(r.jenis) + '</dd></dl>' +
      '<p class="tiny">Diambil daripada rekod. <a class="text-btn" href="rekod.html?ubah=' + r.id + '">Ubah rekod</a></p></div>' +
      '<div class="field" style="margin-top:20px"><span class="lbl">Pegawai terlibat</span><div class="team" id="tim">' + whoH() + '</div></div>' +
      '<div class="field"><label class="lbl" for="ruj">No. rujukan <span class="muted" style="font-weight:400">— pilihan</span></label><input id="ruj" type="text" placeholder="Contoh: surat panggilan, no. tiket" value="' + M.esc(r.ruj || '') + '"></div>';
  }
  function whoH() {
    return team().map(function (n, i) { return '<span>' + M.esc(n) + (i ? ' <button type="button" data-rm="' + (i - 1) + '" aria-label="Buang ' + M.esc(n) + '" style="border:0;padding:0 2px;min-height:0">✕</button>' : ' <em class="muted" style="font-style:normal;font-size:12px">pemilik</em>') + '</span>'; }).join('') +
      '<button type="button" id="addp">+ Pegawai</button>';
  }
  function addPegawai() {
    var opts = D.STAF.filter(function (s) { return team().indexOf(s.n) < 0 && s.n !== 'KPPD'; });
    var d = M.drawer({ title: 'Tambah pegawai', body: '<div class="field"><label class="lbl" for="pp">Pegawai</label><select id="pp">' + opts.map(function (s) { return '<option>' + M.esc(s.n) + '</option>'; }).join('') + '</select></div>', foot: '<button class="btn btn-ink" data-act="ok">Tambah</button>' });
    d.querySelector('[data-act="ok"]').onclick = function () { r.peserta.push(d.querySelector('#pp').value); D.persist(); M.closeDrawer(); $('tim').innerHTML = whoH(); };
  }

  /* ---------- Langkah 2: Kandungan ---------- */
  function p2() {
    return '<div class="field"><label class="lbl" for="obj">Objektif <span class="muted" style="font-weight:400">— pilihan</span></label><textarea id="obj" rows="2" placeholder="Tujuan lawatan / aktiviti.">' + M.esc(r.obj || '') + '</textarea></div>' +
      '<div class="aibox"><label class="lbl" for="cat">Catatan ringkas</label><textarea id="cat" rows="4" placeholder="Tulis ringkas, satu perkara satu baris. Contoh:\nguru guna bahan konkrit untuk pecahan\n3 kelas dipantau\nperlu bimbingan susulan PBD">' + M.esc(r.cat || '') + '</textarea>' +
      '<div class="row"><button class="btn btn-line" type="button" id="ai">Jana draf AI</button><span class="tiny" id="ais">Enjin AI yang sama dengan borang ICT. Dijana daripada maklumat rekod + catatan anda sahaja.</span></div></div>' +
      '<div class="field" style="margin-top:20px"><div class="lblrow"><label class="lbl" for="rum">Rumusan <span style="color:var(--isd)">*</span></label><span id="tag-rum">' + (r.ai ? '<span class="aitag">Draf dibantu AI · semak fakta</span>' : '') + '</span></div><textarea id="rum" rows="5" placeholder="Apa yang berlaku dan dapatan utama.">' + M.esc(r.rum || '') + '</textarea></div>' +
      '<div class="addrow" id="ladd" style="margin-top:6px">' + (r.imp ? '' : '<button type="button" data-add="imp">+ Impak</button>') + (r.ts ? '' : '<button type="button" data-add="ts">+ Tindak susul</button>') + (r.bil ? '' : '<button type="button" data-add="bil">+ Bilangan peserta</button>') + '</div>' +
      '<div class="field" id="x-imp"' + (r.imp ? '' : ' hidden') + '><label class="lbl" for="imp">Impak <span class="muted" style="font-weight:400">— senarai bernombor</span></label><textarea id="imp" rows="3">' + M.esc(r.imp || '') + '</textarea></div>' +
      '<div class="field" id="x-ts"' + (r.ts ? '' : ' hidden') + '><label class="lbl" for="ts">Tindak susul <span class="muted" style="font-weight:400">— teks laporan sahaja</span></label><textarea id="ts" rows="3">' + M.esc(r.ts || '') + '</textarea></div>' +
      '<div class="field" id="x-bil"' + (r.bil ? '' : ' hidden') + '><span class="lbl">Bilangan peserta (tiada nama)</span><div class="num3">' + ['Guru', 'Murid', 'Pihak luar'].map(function (k, i) { return '<input type="number" min="0" class="bil" placeholder="' + k + '" aria-label="' + k + '" value="' + ((r.bil || [])[i] || '') + '">'; }).join('') + '</div></div>';
  }
  /* Simulasi draf AI (enjin sama dengan borang ICT): input = maklumat rekod + catatan pegawai sahaja; tiada fakta baharu. */
  function draft() {
    var c = lines($('cat').value);
    if (!c.length) { $('cat').focus(); M.toast('Tulis catatan dahulu'); return; }
    var b = $('ai'); b.disabled = true; b.textContent = 'Menjana draf…'; $('ais').textContent = 'Sedang menjana · anggaran 30–50 s (demo: segera). Kekalkan halaman ini terbuka.';
    setTimeout(function () {
      var head = r.jenis + ' di ' + place + ' pada ' + dateTxt() + ' melibatkan ' + team().length + ' pegawai.';
      $('rum').value = head + ' ' + c.map(function (x) { return x.charAt(0).toUpperCase() + x.slice(1).replace(/\.?$/, '.'); }).join(' ');
      var imp = c.filter(function (x) { return !/perlu|susul|cadang|akan/i.test(x); }), ts = c.filter(function (x) { return /perlu|susul|cadang|akan/i.test(x); });
      if (imp.length) { $('imp').value = numbered(imp.join('\n')); $('x-imp').hidden = false; }
      if (ts.length) { $('ts').value = numbered(ts.join('\n')); $('x-ts').hidden = false; }
      [].forEach.call(document.querySelectorAll('#ladd [data-add]'), function (x) { if (!document.getElementById('x-' + x.getAttribute('data-add')).hidden) x.hidden = true; });
      r.ai = true; $('tag-rum').innerHTML = '<span class="aitag">Draf dibantu AI · semak fakta</span>';
      b.disabled = false; b.textContent = 'Jana semula';
      $('ais').textContent = 'Draf siap. Betulkan apa-apa yang tidak tepat.';
    }, 1400);
  }

  /* ---------- Langkah 3: Bukti, pratonton, semak ---------- */
  function p3() {
    var g = r.gam || 0;
    return '<div class="field"><div class="lblrow"><span class="lbl">Gambar</span><span class="tiny">' + g + ' / 4 disyorkan · wajib jika mahu terbit</span></div><div class="gal4" id="gal">' +
      [0, 1, 2, 3].map(function (i) { return i < g ? '<button type="button" class="on" data-g="' + i + '">GAMBAR ' + (i + 1) + '</button>' : '<button type="button" data-g="' + i + '" aria-label="Tambah gambar">+</button>'; }).join('') + '</div></div>' +
      '<div class="section-t" style="margin-top:22px">Pratonton format rasmi</div>' + docH() +
      '<div class="share"><button class="btn btn-line btn-sm" type="button" id="pdf">Cetak PDF</button><button class="btn btn-line btn-sm" type="button" id="wa">Salin WhatsApp</button></div>' +
      '<div class="section-t" style="margin-top:22px">Sebelum simpan</div><div class="chk">' +
      (r.ai ? '<label><input type="checkbox" class="ck"> Draf telah disemak — semua fakta betul</label>' : '') +
      '<label><input type="checkbox" class="ck"> Semua pegawai terlibat disenaraikan</label>' +
      '<label><input type="checkbox" class="ck"> Tiada nama murid, data kes atau peperiksaan</label></div>';
  }
  function list(t) { var l = lines(t); return l.length ? '<ol style="padding-left:18px">' + l.map(function (x) { return '<li>' + M.esc(x.charAt(0).toUpperCase() + x.slice(1)) + '</li>'; }).join('') + '</ol>' : '<p>—</p>'; }
  function docH() {
    var bil = r.bil || [], tot = bil.filter(Boolean).length ? 'Guru ' + (bil[0] || 0) + ' · Murid ' + (bil[1] || 0) + ' · Pihak luar ' + (bil[2] || 0) : '—';
    return '<div class="doc" id="doc"><div class="hd"><b>PEJABAT PENDIDIKAN DAERAH KUCHING</b><span>' + M.esc(M.sekName(r.sek)) + '<br>Laporan aktiviti</span></div>' +
      '<h3>' + M.esc(r.tajuk) + '</h3><table>' +
      '<tr><td>Tarikh / masa</td><td>' + dateTxt() + ' · ' + r.mula + '–' + r.akhir + '</td></tr>' +
      '<tr><td>Tempat</td><td>' + M.esc(place) + '</td></tr>' +
      '<tr><td>Jenis aktiviti</td><td>' + M.esc(r.jenis) + '</td></tr>' +
      '<tr><td>Pegawai terlibat</td><td>' + team().map(M.esc).join(', ') + '</td></tr>' +
      (r.ruj ? '<tr><td>No. rujukan</td><td>' + M.esc(r.ruj) + '</td></tr>' : '') +
      '<tr><td>Bilangan peserta</td><td>' + tot + '</td></tr></table>' +
      (r.obj ? '<h4>Objektif</h4><p>' + M.esc(r.obj) + '</p>' : '') +
      '<h4>Rumusan</h4><p>' + (M.esc(r.rum) || '<span style="color:#999">Belum diisi.</span>') + '</p>' +
      (r.imp ? '<h4>Impak</h4>' + list(r.imp) : '') + (r.ts ? '<h4>Tindak susul</h4>' + list(r.ts) : '') +
      ((r.gam || 0) ? '<h4>Gambar</h4><div class="imgs">' + new Array(r.gam + 1).join('<i></i>') + '</div>' : '') +
      '<div class="ft">Disediakan oleh ' + M.esc(r.owner) + ' · ' + M.esc(me.jaw) + '</div></div>';
  }
  function waText() {
    return '*' + r.tajuk.toUpperCase() + '*\n🗓 ' + dateTxt() + '\n📍 ' + place + '\n👥 ' + team().join(', ') + '\n\n' + (r.rum || '') +
      (r.imp ? '\n\n*Impak*\n' + numbered(r.imp) : '') + (r.ts ? '\n\n*Tindak susul*\n' + numbered(r.ts) : '');
  }

  /* ---------- Kawalan ---------- */
  function collect() {
    if ($('ruj')) r.ruj = $('ruj').value.trim();
    if ($('rum')) { r.obj = $('obj').value.trim(); r.cat = $('cat').value.trim(); r.rum = $('rum').value.trim(); r.imp = $('imp').value.trim(); r.ts = $('ts').value.trim();
      var b = [].map.call(document.querySelectorAll('.bil'), function (x) { return x.value ? Number(x.value) : 0; }); r.bil = b.some(Boolean) ? b : null; }
    D.persist();
  }
  function render() {
    $('main').innerHTML = '<nav class="steps" aria-label="Langkah laporan">' + STEPS.map(function (s, i) { return '<button type="button" data-step="' + i + '"' + (i === step ? ' aria-current="step"' : '') + (i < step ? ' class="ok"' : '') + '><b>' + (i < step ? '✓ ' : '') + 'Langkah ' + (i + 1) + '</b><span>' + s + '</span></button>'; }).join('') + '</nav>' +
      '<div class="pane">' + [p1, p2, p3][step]() + '</div>' +
      '<div class="lfoot"><button class="text-btn" type="button" id="draf">Simpan draf</button><div class="r">' +
      (step ? '<button class="btn btn-line" type="button" id="prev">Sebelum</button>' : '') +
      (step < 2 ? '<button class="btn btn-ink" type="button" id="next">Seterusnya</button>' : '<button class="btn btn-ink" type="button" id="save">Simpan laporan</button>') + '</div></div>';
    window.scrollTo(0, 0);
  }
  function go(n) {
    collect();
    if (n === 2 && !r.rum) { if (step !== 1) { step = 1; render(); } $('rum').focus(); M.toast('Isi rumusan dahulu'); return; }
    step = n; render();
  }
  function done() {
    var canPub = r.tahap !== 'sulit' && r.sek !== 'SPsK' && r.sek !== 'SPP';
    $('main').innerHTML = '<div class="donebox"><h2>Laporan disimpan</h2><p>Kekal dalaman — dilihat oleh pegawai yang dibenarkan sahaja. Rekod ini juga dikira dalam Ringkasan Bulanan.</p>' +
      '<div class="share">' + (canPub ? '<a class="btn btn-ink" href="aktiviti.html?terbit=' + r.id + '">Mohon terbit di ppdk.ch</a>' : '') + '<a class="btn btn-line" href="aktiviti.html">Kembali ke Rekod Aktiviti</a></div>' +
      (canPub ? '<p class="tiny" style="margin-top:12px">Terbit = pilihan. Penerbit sektor menyemak sebelum laporan muncul di portal dan Facebook.</p>' : '') + '</div>';
  }
  document.addEventListener('click', function (e) {
    var t = e.target;
    if (t.closest('[data-step]')) { var n = +t.closest('[data-step]').getAttribute('data-step'); if (n !== step) go(n); return; }
    if (t.closest('#next')) { go(step + 1); return; }
    if (t.closest('#prev')) { go(step - 1); return; }
    if (t.closest('#draf')) { collect(); M.toast('Draf disimpan · belum lengkap'); return; }
    if (t.closest('#addp')) { addPegawai(); return; }
    if (t.closest('[data-rm]')) { r.peserta.splice(+t.closest('[data-rm]').getAttribute('data-rm'), 1); D.persist(); $('tim').innerHTML = whoH(); return; }
    if (t.closest('#ai')) { draft(); return; }
    var a = t.closest('#ladd [data-add]'); if (a) { $('x-' + a.getAttribute('data-add')).hidden = false; a.hidden = true; return; }
    var g = t.closest('[data-g]'); if (g) { var i = +g.getAttribute('data-g'); r.gam = i < (r.gam || 0) ? i : i + 1; D.persist(); render(); return; }
    if (t.closest('#pdf')) { window.print(); return; }
    if (t.closest('#wa')) { var s = waText(); try { navigator.clipboard.writeText(s); } catch (x) {} M.toast('Teks WhatsApp disalin'); return; }
    if (t.closest('#save')) {
      collect();
      var cks = document.querySelectorAll('.ck'); if ([].some.call(cks, function (x) { return !x.checked; })) { M.toast('Tandakan semua semakan dahulu'); return; }
      r.status = 'selesai'; r.laporan = 'lengkap'; D.persist(); done(); M.toast('Laporan disimpan · kekal dalaman');
    }
  });
  render();
})();
</script>
</body>
</html>
