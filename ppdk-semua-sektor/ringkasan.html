<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Ringkasan Bulanan · Staf</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="base.css?v=9eee8c54">
<link rel="stylesheet" href="gaya.css?v=cc708408">
<style>
:root{--ac:var(--petrol)}
.nums{display:grid;grid-template-columns:repeat(4,1fr);border-top:3px solid var(--ac);border-bottom:1px solid var(--rule)}
.nums div:first-child b{color:var(--ac)}
.nums div{padding:16px 14px 18px 0}
.nums b{display:block;font:800 40px/1 var(--display);font-stretch:85%}
.nums span{font-size:13px;color:var(--muted)}
.nums .x b{color:var(--ac)}
/* Komposisi sektor (Semua sektor sahaja) */
.mix{margin-top:18px}
.mix .stk{display:flex;height:12px;gap:2px}
.mix .stk i{background:var(--sc);min-width:3px}
.mix .lg{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:10px;font-size:13px;color:var(--ink-2)}
.mix .lg span{display:inline-flex;align-items:center;gap:6px}
.mix .lg b{font:600 12.5px/1 var(--mono);color:var(--ink)}
.ctxk{display:inline-block;width:10px;height:10px;background:var(--ac);margin-right:7px;vertical-align:0}
.bar-r{display:grid;grid-template-columns:140px 1fr 56px;gap:12px;align-items:center;padding:9px 0;font-size:14px;border-bottom:1px solid var(--rule)}
.bar-r .bar{height:8px;background:var(--paper-2);position:relative}
.bar-r .bar i{position:absolute;inset:0 auto 0 0;background:var(--sc,var(--ac))}
.bar-r b{font:600 13px/1 var(--mono);text-align:right}
.trend{display:flex;align-items:flex-end;gap:10px;height:120px;border-bottom:1px solid var(--rule-2);padding-top:10px}
.trend div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;font:500 11px/1 var(--mono);color:var(--muted)}
.trend i{display:block;width:100%;max-width:46px;background:var(--rule-2)}
.trend div:last-child i{background:var(--ac)}
.trend div:last-child{color:var(--ink)}
.tl{display:flex;gap:10px;margin-top:6px}
.tl span{flex:1;text-align:center;font:500 11px/1 var(--mono);color:var(--muted)}
/* Mod pembentangan 16:9 */
.full{position:fixed;inset:0;z-index:80;background:var(--scrim);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.stage{width:min(1280px,94vw,calc((90vh - 60px) * 16 / 9));aspect-ratio:16/9;background:var(--card);border:1px solid var(--rule);padding:clamp(18px,3.5vw,48px);display:flex;flex-direction:column;container-type:inline-size}
.stage .kk{font:500 clamp(10px,1.1cqi,13px)/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ac)}
.stage{border-top:6px solid var(--ac)}
.stage h2{font:800 clamp(20px,3.6cqi,44px)/1.1 var(--display);margin:8px 0 auto}
.stage .nums b{font-size:clamp(28px,6cqi,76px)}
.stage .nums span{font-size:clamp(11px,1.3cqi,15px)}
.stage .bar-r{font-size:clamp(12px,1.5cqi,17px);grid-template-columns:30% 1fr 12%}
.stage .trend{height:clamp(120px,24cqi,300px)}
.stage .ft{display:flex;justify-content:space-between;margin-top:clamp(10px,2cqi,24px);font:500 clamp(9px,1cqi,11px)/1 var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.fnav{display:flex;gap:10px;margin-top:12px;align-items:center}
.fnav button{background:var(--card)}
@media (max-width:780px){.nums{grid-template-columns:1fr 1fr}.nums b{font-size:34px}.bar-r{grid-template-columns:120px 1fr 48px}}
:root[data-theme="dark"] .mix .stk i,:root[data-theme="dark"] .bar-r .bar i{background:color-mix(in srgb,var(--sc,var(--ac)) 65%,#fff)}:root[data-theme="dark"] .nums div:first-child b,:root[data-theme="dark"] .nums .x b,:root[data-theme="dark"] .stage .kk{color:color-mix(in srgb,var(--ac) 55%,#fff)}:root[data-theme="dark"] .nums,:root[data-theme="dark"] .stage{border-top-color:color-mix(in srgb,var(--ac) 65%,#fff)}:root[data-theme="dark"] .trend div:last-child i,:root[data-theme="dark"] .ctxk{background:color-mix(in srgb,var(--ac) 65%,#fff)}
</style>
</head>
<body>
<div id="content" class="wrap-n">
  <div class="page-h"><div><h1>Ringkasan Bulanan</h1><div class="sub" id="ctx"></div></div><button class="btn btn-line" type="button" id="pap">Paparan</button></div>
  <div id="body"></div>
  <div style="margin-top:28px"><button class="btn btn-ink" type="button" id="pres"><svg class="i" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>Mod Pembentangan</button></div>
</div>

<script src="shared.js?v=8a697040"></script>
<script src="data.js?v=e7619fca"></script>
<script>
(function () {
  M.mount({ page: 'ringkasan' });
  var $ = function (id) { return document.getElementById(id); };
  var NUM = { /* ILUSTRASI */
    SPr: { a: 22, s: 9, p: 8, x: ['Sesi data EMIS', 41], tr: [14, 18, 16, 21, 19, 22] },
    SPb: { a: 46, s: 31, p: 17, x: ['Guru dibimbing', 212], tr: [29, 35, 38, 33, 41, 46] },
    SPS: { a: 34, s: 27, p: 12, x: ['Audit selesai', 18], tr: [22, 25, 30, 28, 31, 34] },
    SPbM: { a: 29, s: 24, p: 11, x: ['Murid terlibat', 1840], tr: [18, 26, 24, 30, 27, 29] },
    SPsK: { a: 17, s: 13, p: 7, x: ['Sesi intervensi', 52], tr: [12, 14, 15, 13, 16, 17] },
    SPP: { a: 21, s: 19, p: 9, x: ['Pusat peperiksaan disemak', 38], tr: [10, 12, 14, 17, 19, 21] },
    Pengurusan: { a: 38, s: 26, p: 10, x: ['Tiket ISD ditutup', 64], tr: [30, 28, 34, 36, 35, 38] }
  };
  var JENIS = [['Lawatan pemantauan PdP', 14], ['Bimbingan guru', 13], ['Bengkel / kursus', 7], ['Mesyuarat', 6], ['Program murid', 4]];
  var MO = ['Mei', 'Jun', 'Jul', 'Ogo', 'Sep', 'Okt'];
  var st = { sek: '', ver: 'dalaman', i: 0, month:'2026-10' };

  function ictN(d) { var n = d.list.filter(D.ict).length; return n ? ' · ' + n + ' dari rekod ICT, tidak direkod semula' : ''; }
  function data() {
    var d=D.summary(st.sek,st.month,st.ver==='awam');d.x=null;d.blocked=st.ver==='awam'&&(st.sek==='SPsK'||st.sek==='SPP');
    d.tr=MO.map(function(_,i){return i===5?d.a:null});return d;
  }
  function numsH(d) {
    return '<div class="nums"><div><b>' + d.a + '</b><span>Aktiviti selesai</span></div><div><b>' + d.s + '</b><span>Sekolah terlibat</span></div>' +
      (st.ver === 'awam' ? '' : '<div><b>' + d.p + '</b><span>Pegawai terlibat</span></div>') +
      (d.x ? '<div class="x"><b>' + d.x[1].toLocaleString('ms-MY') + '</b><span>' + d.x[0] + '</span></div>' : '') + '</div>';
  }
  function liputH(d) {
    var low=new Set(),high=new Set();d.list.forEach(function(r){r.sekolah.forEach(function(s){(/^SMK|^SM /i.test(s)?high:low).add(s)})});
    return [['Sekolah rendah',low.size],['Sekolah menengah',high.size]].map(function(x){return '<div class="bar-r"><span>'+x[0]+'</span><span class="bar"><i style="width:'+(d.s?x[1]/d.s*100:0)+'%"></i></span><b>'+x[1]+'</b></div>'}).join('');
  }
  function jenisH(){var d=data();return Object.keys(d.jenis).map(function(k){return '<div class="bar-r"><span>'+M.esc(k)+'</span><span class="bar"><i style="width:'+(d.jenis[k]/Math.max(1,d.a)*100)+'%"></i></span><b>'+d.jenis[k]+'</b></div>'}).join('')||'<p class="tiny">Belum ada laporan lengkap.</p>';}
  function trendH(d){return '<div class="trend">'+d.tr.map(function(v){return '<div>'+(v==null?'—':v)+'<i style="height:'+(v==null?0:Math.max(2,v/Math.max(1,d.a)*85))+'%"></i></div>'}).join('')+'</div><div class="tl">'+MO.map(function(m){return '<span>'+m+'</span>'}).join('')+'</div><p class="tiny" style="margin-top:12px">“—” bermaksud data belum tersedia.</p>';}
  function acc() { return st.sek === 'ALL' ? 'var(--petrol)' : 'var(--s-' + (st.sek === 'Pengurusan' ? 'PGR' : st.sek) + ')'; }
  function mixH() {
    if (st.sek !== 'ALL') return '';
    var rows = M.SEKTOR.map(function (x) { return [x.k, D.summary(x.k, st.month, st.ver === 'awam').a]; }).filter(function (x) { return x[1] > 0; });
    var tot = rows.reduce(function (a, x) { return a + x[1]; }, 0); if (!tot) return '';
    var c = function (k) { return 'var(--s-' + (k === 'Pengurusan' ? 'PGR' : k) + ')'; };
    return '<div class="mix"><div class="stk" role="img" aria-label="Aktiviti ikut sektor">' + rows.map(function (x) { return '<i style="--sc:' + c(x[0]) + ';flex:' + x[1] + '" title="' + x[0] + ': ' + x[1] + '"></i>'; }).join('') + '</div>' +
      '<div class="lg">' + rows.map(function (x) { return '<span>' + M.sk(x[0]) + '<b>' + x[1] + '</b></span>'; }).join('') + '</div></div>';
  }
  function label() { return (st.sek === 'ALL' ? 'Semua sektor' : M.sekName(st.sek)) + ' · Oktober 2026' + (st.ver === 'awam' ? ' · versi awam' : ''); }

  function render() {
    var d = data();
    document.documentElement.style.setProperty('--ac', acc());
    $('ctx').innerHTML = '<span class="ctxk"></span>' + M.esc(label());
    if (d.blocked) { $('body').innerHTML = '<div class="empty" style="border-top:1px solid var(--ink)">Sektor ini tiada versi awam sehingga sektor bersetuju.</div>'; return; }
    $('body').innerHTML = '<p class="tiny" style="margin-bottom:14px">Laporan lengkap Dalaman + Umum · aktiviti unik dikira sekali' + (st.ver === 'awam' ? '' : ictN(d)) + '</p>' + numsH(d) + mixH() + '<details class="more"><summary>Lihat liputan, jenis dan trend</summary>' +
      '<div class="sec-t"><h2>Sekolah terlibat</h2></div>' + liputH(d) +
      (st.ver === 'awam' ? '' : '<div class="sec-t"><h2>Jenis aktiviti</h2><span>ikut katalog sektor</span></div>' + jenisH()) +
      '<div class="sec-t"><h2>6 bulan</h2></div>' + trendH(d) + '</details>';
  }
  function slides() { return st.ver === 'awam' ? ['exec', 'lip', 'tr'] : ['exec', 'lip', 'jen', 'tr']; }
  function slide() {
    var d = data(), s = slides(), k = s[st.i];
    var T = { exec: ['Laporan eksekutif', label().split(' · ')[0], numsH(d) + mixH()], lip: ['Liputan', 'Sekolah terlibat', liputH(d)], jen: ['Tujuan', 'Jenis aktiviti', jenisH()], tr: ['Trend', 'Aktiviti selesai, 6 bulan', trendH(d)] }[k];
    return '<div class="stage"><div class="kk">' + T[0] + ' · Oktober 2026</div><h2>' + T[1] + '</h2><div>' + T[2] + '</div><div class="ft"><span>PPDK.CH · Ringkasan Bulanan</span><span>' + (st.i + 1) + ' / ' + s.length + '</span></div></div>' +
      '<div class="fnav"><button class="btn btn-line btn-sm" data-n="-1"' + (st.i ? '' : ' disabled') + '>← Sebelum</button><button class="btn btn-line btn-sm" data-n="1"' + (st.i < s.length - 1 ? '' : ' disabled') + '>Seterusnya →</button><button class="btn btn-line btn-sm" data-n="x">Tutup</button></div>';
  }
  function pres() {
    if (data().blocked) return;
    st.i = 0; var f = document.createElement('div'); f.className = 'full'; f.id = 'full'; f.innerHTML = slide(); document.body.appendChild(f);
    f.addEventListener('click', function (e) { var b = e.target.closest('[data-n]'); if (!b) return; var n = b.getAttribute('data-n'); if (n === 'x') { f.remove(); return; } st.i += +n; f.innerHTML = slide(); });
  }
  document.addEventListener('keydown', function (e) {
    var f = $('full'); if (!f) return;
    if (e.key === 'Escape') f.remove();
    if (e.key === 'ArrowRight' && st.i < slides().length - 1) { st.i++; f.innerHTML = slide(); }
    if (e.key === 'ArrowLeft' && st.i > 0) { st.i--; f.innerHTML = slide(); }
  });
  function paparan() {
    var d = M.drawer({ title: 'Paparan', body:
      '<div class="field"><label class="lbl" for="psek">Sektor</label><select id="psek"><option value="ALL">Semua sektor</option>' + M.SEKTOR.map(function (s) { return '<option value="' + s.k + '"' + (s.k === st.sek ? ' selected' : '') + '>' + s.n + '</option>'; }).join('') + '</select></div>' +
      '<div class="field"><label class="lbl" for="pbln">Bulan</label><select id="pbln"><option>Oktober 2026</option><option disabled>September 2026 · belum tersedia</option></select></div>' +
      '<div class="field"><span class="lbl">Versi</span><div class="seg" id="pver"><button type="button" data-v="dalaman" aria-pressed="' + (st.ver === 'dalaman') + '">Dalaman</button><button type="button" data-v="awam" aria-pressed="' + (st.ver === 'awam') + '">Versi awam</button></div><p class="hint">Versi awam: agregat sahaja; SPsK &amp; SPP tidak termasuk.</p></div>',
      foot: '<button class="btn btn-ink" data-act="ok">Tunjuk</button>' });
    if (st.sek === 'ALL') d.querySelector('#psek').value = 'ALL';
    var v = st.ver;
    d.querySelector('#pver').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; v = b.getAttribute('data-v'); [].forEach.call(this.children, function (x) { x.setAttribute('aria-pressed', x === b); }); });
    d.querySelector('[data-act="ok"]').addEventListener('click', function () { st.sek = d.querySelector('#psek').value; st.ver = v; M.closeDrawer(); render(); });
  }
  $('pap').addEventListener('click', paparan);
  $('pres').addEventListener('click', pres);
  function init() { st.sek = M.role() === 'kppd' ? 'ALL' : M.me().sek; render(); }
  document.addEventListener('rolechange', init);
  init();
})();
</script>
</body>
</html>
