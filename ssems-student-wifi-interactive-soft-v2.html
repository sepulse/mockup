<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f6f9">
<title>Wi-Fi Pelajar SSeMS</title>
<style>
:root {
  --ink:#101010;
  --muted:#4a4a4a;
  --orange:#ff9800;
  --orange-red:#ff3b00;
  --paper:#fff;
  --footer:#191919;
}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:24px 12px;
  background:#f1f5f9;
  font-family:Arial,Helvetica,sans-serif;
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
.portal-frame{
  position:relative;
  width:min(400px,calc(100vw - 24px));
  aspect-ratio:400 / 766;
  flex:0 0 auto;
  margin:auto 0;
}
.portal{
  position:absolute;
  left:0;
  top:0;
  width:400px;
  height:766px;
  overflow:hidden;
  background:
    radial-gradient(ellipse at 50% 18%,rgba(255,255,255,.98) 0 31%,rgba(255,252,247,.96) 58%,rgba(247,244,238,.98) 100%);
  border-radius:14px;
  box-shadow:0 22px 55px rgba(45,62,78,.22),0 4px 14px rgba(45,62,78,.09);
  isolation:isolate;
  transform-origin:top left;
  transform:scale(var(--portal-scale,1));
}
.art{position:absolute;pointer-events:none;user-select:none;z-index:1}
.art-top{left:0;top:0;width:42%;height:auto}
.art-bottom{right:0;bottom:48px;width:60%;height:auto}
.logo{position:absolute;z-index:3;left:50%;top:50px;width:28.6%;transform:translateX(-50%);height:auto}
.lang{position:absolute;right:18px;top:20px;z-index:5;display:flex;align-items:center;gap:.7em;font-size:14px;color:#444}
.lang button{appearance:none;border:0;background:none;padding:.15em .05em .35em;font:inherit;color:inherit;cursor:pointer;position:relative}
.lang button.active{font-weight:800;color:#111}
.lang button.active::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;border-radius:999px;background:var(--orange)}
.lang-sep{opacity:.55}
.tagline{position:absolute;z-index:4;left:11%;right:11%;top:180px;margin:0;text-align:center;font:italic 17px/1.08 Georgia,"Times New Roman",serif;color:#171717}
.tagline .line{display:block}
.brush-divider{position:absolute;z-index:4;left:40%;top:235px;width:20%;height:7px;transform:skewX(-18deg) rotate(-3deg);background:linear-gradient(90deg,transparent 0 3%,#f0a000 10% 88%,transparent 96%);clip-path:polygon(0 72%,30% 24%,72% 13%,100% 30%,70% 42%,31% 60%)}
.welcome{position:absolute;z-index:4;left:8%;right:8%;top:267px;margin:0;text-align:center;font-size:12.5px;font-weight:800;letter-spacing:.29em;color:#54514c}
.hero-title{position:absolute;z-index:4;left:4%;right:4%;top:298px;margin:0;text-align:center;font-family:"Arial Black",Impact,Arial,sans-serif;font-size:40px;line-height:.95;letter-spacing:-.035em;white-space:nowrap}
.hero-title .accent{color:var(--orange-red)}
.subtitle{position:absolute;z-index:4;left:8%;right:8%;top:349px;margin:0;text-align:center;font-size:13.5px;font-weight:500;color:#4f4c48}
.connect{position:absolute;z-index:6;left:9%;right:9%;top:389px;height:58px;border:1px solid rgba(0,0,0,.88);border-radius:11px;background:linear-gradient(105deg,#171717 0%,#202020 55%,#171717 100%);box-shadow:0 10px 22px rgba(0,0,0,.14),inset 0 1px rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;gap:2.5%;color:white;text-decoration:none;font-size:14.5px;font-weight:800;letter-spacing:.025em;cursor:pointer;transition:transform .16s ease,filter .16s ease,box-shadow .2s ease}
.connect:hover{filter:brightness(1.03);transform:translateY(-1px)}
.connect:active{transform:translateY(1px)}
.arrow{position:relative;width:26px;min-width:26px;height:26px;border:1px solid rgba(255,157,0,.55);border-radius:50%}
.arrow::before{content:"";position:absolute;left:6px;top:50%;width:10px;height:2px;background:#ffb000;transform:translateY(-50%)}
.arrow::after{content:"";position:absolute;right:6px;top:50%;width:6px;height:6px;border-top:2px solid #ffb000;border-right:2px solid #ffb000;transform:translateY(-50%) rotate(45deg)}
.notice{position:absolute;z-index:4;left:8%;right:8%;top:468px;height:106px;border:1px solid rgba(55,48,38,.12);border-radius:12px;background:linear-gradient(180deg,rgba(255,252,246,.98),rgba(250,246,238,.98));box-shadow:0 9px 22px rgba(60,50,40,.045);display:flex;align-items:center;padding:12px 18px 10px;text-align:center}
.notice::before{content:"";position:absolute;left:50%;top:-1px;width:64px;height:3px;transform:translateX(-50%);border-radius:0 0 999px 999px;background:linear-gradient(90deg,#e3a000,#ff6400)}
.notice-copy{width:100%;min-width:0}
.notice h2{margin:1px 0 4px;font-size:11.5px;line-height:1;font-weight:900;letter-spacing:.13em;color:#5b5348}
.notice-hours{display:block;font:700 19px/1.03 Georgia,"Times New Roman",serif;letter-spacing:.01em;color:#161412}
.notice-use{display:block;margin-top:5px;font-size:10.5px;line-height:1.2;color:#6b655d;white-space:nowrap}
.rules-trigger{appearance:none;border:0;background:none;margin:7px 0 0;padding:5px 12px 0;border-top:1px solid rgba(72,61,48,.1);font:800 10px/1 Arial,Helvetica,sans-serif;letter-spacing:.075em;color:#b94a05;cursor:pointer;white-space:nowrap}
.rules-trigger::after{content:" →"}
.rules-trigger:hover{color:#9f3500}
.rules-trigger:focus-visible{outline:2px solid #111;outline-offset:3px;border-radius:2px}
.rules-overlay[hidden]{display:none!important}
.rules-overlay{position:absolute;z-index:40;inset:0;padding:22px 18px;background:rgba(25,22,18,.62);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center}
.rules-panel{position:relative;width:100%;max-height:100%;overflow:hidden;border:1px solid rgba(62,52,40,.13);border-radius:14px;background:linear-gradient(180deg,#fffdf9 0%,#faf6ee 100%);box-shadow:0 28px 64px rgba(20,17,14,.32);display:flex;flex-direction:column;color:#211e1a}
.rules-panel::before{content:"";position:absolute;z-index:2;left:50%;top:0;width:72px;height:4px;transform:translateX(-50%);border-radius:0 0 999px 999px;background:linear-gradient(90deg,#e3a000,#ff6400)}
.rules-head{position:relative;display:flex;align-items:flex-start;justify-content:center;padding:24px 50px 17px;border-bottom:1px solid rgba(72,61,48,.1);text-align:center}
.rules-head h2{margin:0;max-width:270px;font-size:15px;line-height:1.22;font-weight:900;letter-spacing:.055em;color:#29241f}
.rules-close{position:absolute;right:12px;top:12px;width:36px;height:36px;border:1px solid rgba(63,53,42,.12);border-radius:50%;background:rgba(255,255,255,.66);color:#27231f;font:400 23px/1 Arial,Helvetica,sans-serif;cursor:pointer;transition:background .18s ease,border-color .18s ease,transform .18s ease}
.rules-close:hover{background:#fff8ef;border-color:rgba(216,112,23,.24);transform:translateY(-1px)}
.rules-close:focus-visible{outline:2px solid #c84a00;outline-offset:2px}
.rules-body{overflow:auto;overscroll-behavior:contain;padding:14px 18px 5px;-webkit-overflow-scrolling:touch;scrollbar-color:#c9b8a4 transparent}
.rules-list{counter-reset:rule;margin:0;padding:0;list-style:none}
.rules-list li{position:relative;counter-increment:rule;margin:0;padding:11px 7px 11px 40px;border-bottom:1px solid rgba(72,61,48,.075);font-size:11.25px;line-height:1.46;color:#5e574f;text-align:left}
.rules-list li:last-child{border-bottom:0}
.rules-list li::before{content:counter(rule,decimal-leading-zero);position:absolute;left:3px;top:11px;width:27px;height:27px;border:1px solid rgba(210,126,40,.2);border-radius:50%;background:#fff9f0;display:flex;align-items:center;justify-content:center;color:#bd4b08;font:900 9px/1 Arial,Helvetica,sans-serif;letter-spacing:.02em}
.rules-list strong{display:block;margin-bottom:3px;font-size:11.75px;line-height:1.22;color:#211e1a;letter-spacing:.01em}
.rules-actions{padding:11px 18px 16px;border-top:1px solid rgba(72,61,48,.09);background:rgba(250,246,238,.9)}
.rules-done{position:relative;width:100%;min-height:44px;border:1px solid rgba(0,0,0,.88);border-radius:10px;background:linear-gradient(105deg,#171717 0%,#202020 55%,#171717 100%);box-shadow:0 8px 18px rgba(0,0,0,.12),inset 0 1px rgba(255,255,255,.07);color:#fff;font:800 11.5px/1 Arial,Helvetica,sans-serif;letter-spacing:.075em;cursor:pointer;transition:transform .18s ease,box-shadow .18s ease,filter .18s ease}
.rules-done::after{content:"  →";color:#ffad00}
.rules-done:hover{filter:brightness(1.055);transform:translateY(-1px);box-shadow:0 10px 20px rgba(0,0,0,.16)}
.rules-done:focus-visible{outline:3px solid #ff9800;outline-offset:2px}
.lettering{position:absolute;z-index:3;left:8.5%;top:590px;width:39%;height:auto;pointer-events:none}
.footer{position:absolute;z-index:7;left:0;right:0;bottom:0;height:48px;background:rgba(247,244,238,.97);border-top:1px solid rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;color:#2e2b27}
.footer .school-name{position:relative;display:flex;align-items:center;justify-content:center;white-space:nowrap;font-size:10px;font-weight:800;letter-spacing:.13em}
.footer .school-name::before{content:"";width:24px;height:3px;border-radius:999px;background:#ee9d00;margin-right:11px;display:inline-block}
.toast{position:absolute;z-index:20;left:50%;bottom:62px;transform:translate(-50%,15px);max-width:78%;padding:.72em 1em;border-radius:10px;background:rgba(20,20,20,.94);color:#fff;text-align:center;font-size:11px;line-height:1.35;opacity:0;pointer-events:none;transition:.22s ease}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-height:720px){body{justify-content:flex-start}}
@media (prefers-reduced-motion:reduce){.connect,.toast{transition:none}}

/* === Interactive enhancement layer === */
.portal{
  --px:0;
  --py:0;
  perspective:900px;
  transition:box-shadow .28s ease;
}
.portal.is-active{
  box-shadow:0 22px 48px rgba(45,62,78,.18),0 4px 12px rgba(45,62,78,.08);
}
.art,.logo,.lettering,.tagline,.brush-divider,.welcome,.hero-title,.subtitle{
  will-change:translate,transform,filter;
}
.art-top{transition:translate .22s ease-out,filter .28s ease}
.art-bottom{transition:translate .22s ease-out,filter .28s ease}
.logo{transition:translate .22s ease-out,filter .25s ease}
.lettering{transition:translate .22s ease-out,filter .25s ease}
.tagline,.welcome,.hero-title,.subtitle{transition:translate .20s ease-out}
.brush-divider{transition:translate .20s ease-out,transform .22s ease,filter .22s ease}
.notice{
  transform:none !important;
  translate:none !important;
  backface-visibility:visible;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  transition:box-shadow .22s ease,border-color .22s ease,background-color .22s ease;
}
.notice *{
  transform:none !important;
  translate:none !important;
  text-shadow:none !important;
}
.notice:hover{
  box-shadow:0 11px 24px rgba(60,50,40,.06);
  border-color:rgba(210,126,40,.22);
}
.connect{
  overflow:hidden;
  isolation:isolate;
  transition:transform .18s ease,filter .18s ease,box-shadow .22s ease;
}
.connect::before{
  content:"";
  position:absolute;
  inset:-35% auto -35% -45%;
  width:34%;
  background:linear-gradient(110deg,transparent,rgba(255,255,255,.46),transparent);
  transform:skewX(-18deg);
  transition:left .52s cubic-bezier(.2,.75,.2,1);
  pointer-events:none;
  z-index:0;
}
.connect:hover::before{left:115%}
.connect:hover{
  filter:brightness(1.055);
  transform:translateY(-1px) scale(1.004);
  box-shadow:0 12px 24px rgba(0,0,0,.18),0 0 0 1px rgba(255,166,0,.08),inset 0 1px rgba(255,255,255,.08);
}
.connect > *{position:relative;z-index:1}
.connect .arrow{transition:transform .22s ease}
.connect:hover .arrow{transform:translateX(3px)}
.connect.pressed{transform:translateY(.5px) scale(.992)}
.hero-title .accent{
  display:inline-block;
  transition:transform .22s ease,text-shadow .22s ease;
}
.portal.is-active .hero-title .accent{
  text-shadow:0 8px 20px rgba(255,59,0,.12);
}
.brush-divider.alive{
  animation:brushPulse 1.6s ease-in-out infinite alternate;
}
@keyframes brushPulse{
  from{filter:saturate(1);transform:skewX(-22deg) rotate(-4deg) scaleX(.975)}
  to{filter:saturate(1.2);transform:skewX(-22deg) rotate(-4deg) scaleX(1.025)}
}
.lang button{
  transition:color .18s ease,transform .18s ease;
}
.lang button:hover{transform:translateY(-1px);color:#111}
.footer .school-name{
  transition:letter-spacing .2s ease,opacity .2s ease;
}
.footer .school-name:hover{letter-spacing:.14em;opacity:.9}

@media (hover:hover) and (pointer:fine){
  .portal:hover .art-top{filter:saturate(1.04)}
  .portal:hover .art-bottom{filter:saturate(1.04)}
  .portal:hover .logo{filter:drop-shadow(0 8px 14px rgba(0,0,0,.08))}
}
@media (prefers-reduced-motion:reduce){
  .art,.logo,.lettering,.tagline,.brush-divider,.welcome,.hero-title,.subtitle,
  .connect,.connect::before,.connect .arrow,.hero-title .accent,.lang button,.footer .school-name{
    transition:none!important;
    animation:none!important;
  }
}

</style>

<script>
/*
  Integrasi captive portal:
  Tetapkan URL login sebenar di sini. Contoh:
  window.SSeMS_CONNECT_URL = 'https://portal.example/login';
*/
window.SSeMS_CONNECT_URL = window.SSeMS_CONNECT_URL || '';

const PORTAL_BASE_WIDTH = 400;
const portalFrame = document.getElementById('portalFrame');
const portalCanvas = document.querySelector('.portal');

function syncPortalScale() {
  if (!portalFrame || !portalCanvas) return;
  const scale = Math.min(1, portalFrame.clientWidth / PORTAL_BASE_WIDTH);
  portalCanvas.style.setProperty('--portal-scale', scale.toFixed(5));
}

syncPortalScale();
if ('ResizeObserver' in window) {
  new ResizeObserver(syncPortalScale).observe(portalFrame);
} else {
  window.addEventListener('resize', syncPortalScale, { passive:true });
}

const copy = {
  ms: {
    tagline: '<span class="line">Penjana Pewaris Budaya Bangsa</span>',
    welcome: 'SELAMAT DATANG',
    heroPrefix: 'PELAJAR',
    heroAccent: 'SSeMS',
    subtitle: 'Akses Wi-Fi untuk pelajar SSeMS',
    connect: 'SAMBUNG KE WI-FI',
    noticeTitle: 'AKSES WI-FI PELAJAR',
    noticeHours: '7:00 PAGI — 10:00 MALAM',
    noticeUse: 'Untuk pembelajaran dan urusan rasmi sekolah',
    rulesLink: 'BACA 6 PERATURAN',
    rulesTitle: 'PERATURAN PENGGUNAAN WI-FI PELAJAR',
    rulesDone: 'TUTUP',
    rulesCloseLabel: 'Tutup peraturan',
    rules: [
      ['Waktu Akses', 'Capaian Wi-Fi hanya dibenarkan dari 7:00 pagi hingga 10:00 malam sahaja.'],
      ['Tujuan Penggunaan', 'Gunakan rangkaian ini khusus untuk tujuan pembelajaran dan urusan rasmi sekolah sahaja.'],
      ['Kandungan Terlarang', 'Dilarang memuat turun, melihat, atau berkongsi kandungan yang tidak sesuai, berunsur negatif, atau menyalahi undang-undang.'],
      ['Integriti Rangkaian', 'Dilarang melakukan sebarang cubaan menceroboh, mengganggu kestabilan, atau merosakkan sistem rangkaian sekolah.'],
      ['Akaun Peribadi', 'Setiap pelajar bertanggungjawab sepenuhnya terhadap semua aktiviti yang berlaku melalui akaun atau peranti masing-masing.'],
      ['Tindakan Disiplin', 'Pihak sekolah berhak memantau, menyekat akses, serta mengambil tindakan tatatertib sekiranya berlaku salah laku atau pelanggaran peraturan.']
    ],
    demo: 'Butang sudah sedia. Tetapkan SSeMS_CONNECT_URL kepada URL captive portal sebenar.'
  },
  en: {
    tagline: '<span class="line">Penjana Pewaris Budaya Bangsa</span>',
    welcome: 'WELCOME',
    heroPrefix: 'SSeMS',
    heroAccent: 'STUDENT',
    subtitle: 'Wi-Fi access for SSeMS students',
    connect: 'CONNECT TO WI-FI',
    noticeTitle: 'STUDENT WI-FI ACCESS',
    noticeHours: '7:00 AM — 10:00 PM',
    noticeUse: 'For learning and official school matters',
    rulesLink: 'READ 6 RULES',
    rulesTitle: 'STUDENT WI-FI USAGE RULES',
    rulesDone: 'CLOSE',
    rulesCloseLabel: 'Close rules',
    rules: [
      ['Access Hours', 'Wi-Fi access is only permitted from 7:00 AM until 10:00 PM.'],
      ['Permitted Use', 'Use this network only for learning and official school matters.'],
      ['Prohibited Content', 'Downloading, viewing, or sharing inappropriate, harmful, or unlawful content is prohibited.'],
      ['Network Integrity', 'Any attempt to intrude into, disrupt, or damage the school network is prohibited.'],
      ['Personal Account', 'Each student is fully responsible for all activity carried out through their own account or device.'],
      ['Disciplinary Action', 'The school reserves the right to monitor and restrict access, and to take disciplinary action in cases of misconduct or rule violations.']
    ],
    demo: 'The button is ready. Set SSeMS_CONNECT_URL to your captive portal login URL.'
  }
};
const buttons = [...document.querySelectorAll('[data-lang]')];
const toast = document.getElementById('toast');
const rulesOverlay = document.getElementById('rulesOverlay');
const rulesTrigger = document.getElementById('rulesTrigger');
const rulesClose = document.getElementById('rulesClose');
const rulesDone = document.getElementById('rulesDone');
const rulesList = document.getElementById('rulesList');
let lang = 'ms';

function renderRules(items) {
  rulesList.replaceChildren(...items.map(([title, body]) => {
    const li = document.createElement('li');
    const strong = document.createElement('strong');
    strong.textContent = title;
    li.append(strong, document.createTextNode(body));
    return li;
  }));
}

function applyLanguage(next) {
  lang = next;
  document.documentElement.lang = next;
  const t = copy[next];
  document.querySelector('[data-i18n="tagline"]').innerHTML = t.tagline;
  for (const key of ['welcome','heroPrefix','heroAccent','subtitle','connect','noticeTitle','noticeHours','noticeUse','rulesLink','rulesTitle','rulesDone']) {
    const el = document.querySelector(`[data-i18n="${key}"]`);
    if (el) el.textContent = t[key];
  }
  rulesClose.setAttribute('aria-label', t.rulesCloseLabel);
  renderRules(t.rules);
  buttons.forEach(b => b.classList.toggle('active', b.dataset.lang === next));
}
buttons.forEach(b => b.addEventListener('click', () => applyLanguage(b.dataset.lang)));

function openRules() {
  rulesOverlay.hidden = false;
  rulesClose.focus();
}

function closeRules() {
  rulesOverlay.hidden = true;
  rulesTrigger.focus();
}

rulesTrigger.addEventListener('click', openRules);
rulesClose.addEventListener('click', closeRules);
rulesDone.addEventListener('click', closeRules);
rulesOverlay.addEventListener('click', event => {
  if (event.target === rulesOverlay) closeRules();
});
document.addEventListener('keydown', event => {
  if (event.key === 'Escape' && !rulesOverlay.hidden) closeRules();
});
applyLanguage(lang);

function showToast(message) {
  toast.textContent = message;
  toast.classList.add('show');
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => toast.classList.remove('show'), 2600);
}

document.getElementById('connectButton').addEventListener('click', e => {
  e.preventDefault();
  if (window.SSeMS_CONNECT_URL) {
    location.href = window.SSeMS_CONNECT_URL;
    return;
  }
  showToast(copy[lang].demo);
});

/* === Interactive enhancement layer === */
(() => {
  const portal = document.querySelector('.portal');
  const topArt = document.querySelector('.art-top');
  const bottomArt = document.querySelector('.art-bottom');
  const logo = document.querySelector('.logo');
  const lettering = document.querySelector('.lettering');
  const tagline = document.querySelector('.tagline');
  const brush = document.querySelector('.brush-divider');
  const welcome = document.querySelector('.welcome');
  const title = document.querySelector('.hero-title');
  const subtitle = document.querySelector('.subtitle');
  const notice = document.querySelector('.notice');
  const connect = document.getElementById('connectButton');

  if (!portal) return;

  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const fine = matchMedia('(hover:hover) and (pointer:fine)').matches;

  const layers = [
    [topArt, -3.2, -2.3],
    [bottomArt, 3.6, 2.8],
    [logo, 1.8, 1.4],
    [lettering, -2.2, 1.8],
    [tagline, 1.0, 0.7],
    [brush, -0.9, 0.6],
    [welcome, 0.7, 0.45],
    [title, 1.4, 0.9],
    [subtitle, 0.8, 0.5]
  ].filter(([el]) => el);

  let raf = 0;
  let lastX = 0;
  let lastY = 0;

  function renderDepth() {
    raf = 0;
    for (const [el, dx, dy] of layers) {
      el.style.translate = `${(lastX * dx).toFixed(2)}px ${(lastY * dy).toFixed(2)}px`;
    }
  }

  function resetDepth() {
    for (const [el] of layers) el.style.translate = '';
  }

  if (fine && !reduced) {
    portal.addEventListener('pointerenter', () => {
      portal.classList.add('is-active');
      brush?.classList.add('alive');
    });

    portal.addEventListener('pointermove', (event) => {
      const r = portal.getBoundingClientRect();
      lastX = ((event.clientX - r.left) / r.width - 0.5) * 2;
      lastY = ((event.clientY - r.top) / r.height - 0.5) * 2;
      if (!raf) raf = requestAnimationFrame(renderDepth);
    });

    portal.addEventListener('pointerleave', () => {
      portal.classList.remove('is-active');
      brush?.classList.remove('alive');
      resetDepth();
    });
  }

  if (connect) {
    connect.addEventListener('pointerdown', () => connect.classList.add('pressed'));
    const release = () => connect.classList.remove('pressed');
    connect.addEventListener('pointerup', release);
    connect.addEventListener('pointercancel', release);
    connect.addEventListener('pointerleave', release);
  }

  // Mobile: one short, restrained motion cue when the card becomes visible.
  if (!fine && !reduced) {
    portal.classList.add('is-active');
    brush?.classList.add('alive');
    setTimeout(() => {
      portal.classList.remove('is-active');
      brush?.classList.remove('alive');
    }, 1800);
  }
})();

</script>
